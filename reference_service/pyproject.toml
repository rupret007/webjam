[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webjam-reference-service"
version = "0.1.0"
description = "Bounded v3 WebJam rendezvous and exact-peer relay reference service"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
webjam-reference = "webjam_reference.__main__:main"

[tool.setuptools]
packages = ["webjam_reference"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
