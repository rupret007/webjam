<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>WebJam</title>
  <desc>Three linked loops for musicians playing together.</desc>
  <!--
    Portable vector companion for the native QPainter WebJam mark. Three
    linked rounded loops and three circular anchor rings match the supplied
    WebJam trinity reference while staying independent of any companion
    product or integration.
  -->
  <defs>
    <linearGradient id="webjam-warm-ribbon" x1="16%" y1="10%" x2="84%" y2="90%">
      <stop offset="0%" stop-color="#E87900"/>
      <stop offset="30%" stop-color="#F28A00"/>
      <stop offset="67%" stop-color="#F06A00"/>
      <stop offset="100%" stop-color="#BF5700"/>
    </linearGradient>
    <radialGradient id="webjam-node" cx="34%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#F5A13A"/>
      <stop offset="42%" stop-color="#E87900"/>
      <stop offset="100%" stop-color="#E77600"/>
    </radialGradient>
  </defs>
  <path
    fill="none"
    stroke="url(#webjam-warm-ribbon)"
    stroke-width="4.86"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M32 9.6 C19.84 23.04 19.84 40.96 32 54.4 C44.16 40.96 44.16 23.04 32 9.6"
  />
  <path
    fill="none"
    stroke="url(#webjam-warm-ribbon)"
    stroke-width="4.86"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M9.856 48 C28.352 51.392 42.304 43.328 48.64 25.6 C30.144 22.208 16.192 30.272 9.856 48"
  />
  <path
    fill="none"
    stroke="url(#webjam-warm-ribbon)"
    stroke-width="4.86"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M54.144 48 C47.808 30.272 33.856 22.208 15.36 25.6 C21.696 43.328 35.648 51.392 54.144 48"
  />
  <g fill="url(#webjam-node)">
    <circle cx="32" cy="9.6" r="4.22"/>
    <circle cx="54.144" cy="48" r="4.22"/>
    <circle cx="9.856" cy="48" r="4.22"/>
  </g>
  <g fill="#0A0A0A">
    <circle cx="32" cy="9.6" r="2.24"/>
    <circle cx="54.144" cy="48" r="2.24"/>
    <circle cx="9.856" cy="48" r="2.24"/>
  </g>
</svg>
