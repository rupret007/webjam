<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>WebJam</title>
  <desc>Three connected paths represent conversation, live music, and production.</desc>
  <!--
    Original WebJam triad mark. The three identical, rotating paths share one
    visual rhythm without borrowing the logo geometry of any integrated app.
    A single stroke keeps the mark useful at 16 px and in one-color contexts.
  -->
  <g
    fill="none"
    stroke="#BF5700"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M32 7 C43 7 52 16 52 27 C52 34 48 40 42 44"/>
    <path d="M32 7 C43 7 52 16 52 27 C52 34 48 40 42 44" transform="rotate(120 32 32)"/>
    <path d="M32 7 C43 7 52 16 52 27 C52 34 48 40 42 44" transform="rotate(240 32 32)"/>
  </g>
</svg>
