<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebJam — Webex</title>
  <!-- Webex Meetings Widget (CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@webex/widgets@1.28.2/dist/css/webexWidgets.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #080808; color: #FFFFFF; font-family: "Inter", "Segoe UI", sans-serif; }

    /* Loading / error states */
    #status-overlay {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; width: 100%; height: 100%;
      position: absolute; top: 0; left: 0; z-index: 10;
    }
    #status-overlay.hidden { display: none; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #2C2C2C;
      border-top-color: #BF5700; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
    #status-text { font-size: 14px; color: #D0D0D0; }
    #error-detail { font-size: 12px; color: #FFFFFF; display: none; }

    /* Meeting widget container */
    #webex-container {
      width: 100%; height: 100%; display: none;
    }
    #webex-container.visible { display: block; }
  </style>
</head>
<body>
  <div id="status-overlay">
    <div class="spinner"></div>
    <p id="status-text">Connecting to Webex…</p>
    <p id="error-detail"></p>
  </div>
  <div id="webex-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@webex/widgets@1.28.2/dist/webexWidgets.umd.min.js"></script>
  <script>
    // qt.webChannelTransport is injected by QWebChannel when the view is ready.
    // We wait for it before reporting state back to Qt.

    var _bridge = null;
    var _meetingStarted = false;
    // Reference to the active Webex Meetings Widget instance, set in
    // startWebexMeeting and used by window.mute_self for Jamulus<->Webex
    // mute synchronisation.
    var _widgetInstance = null;

    function _setBridge(b) {
      _bridge = b;
      _bridge.on_page_ready();
    }

    function _notifyState(state) {
      if (_bridge) _bridge.on_state(state);
    }

    function showError(msg) {
      document.getElementById('status-text').textContent = 'Webex connection failed';
      var detail = document.getElementById('error-detail');
      detail.textContent = msg;
      detail.style.display = 'block';
      _notifyState('error');
    }

    // Called by Qt (via runJavaScript) once it has an access token and meeting destination
    window.startWebexMeeting = function(accessToken, meetingDestination) {
      if (typeof WebexWidgets === 'undefined') {
        showError('Webex widget script failed to load. Check internet connection.');
        return;
      }
      try {
        var container = document.getElementById('webex-container');
        container.classList.add('visible');
        document.getElementById('status-overlay').classList.add('hidden');

        _widgetInstance = WebexWidgets.WebexMeetingWidget({
          container: container,
          accessToken: accessToken,
          meetingDestination: meetingDestination,
          theme: { isDarkMode: true },
          onMeetingStateChange: function(state) {
            _notifyState(state || 'unknown');
          },
          onError: function(err) {
            showError(err ? String(err) : 'Unknown widget error');
          },
        });
        _notifyState('joining');
      } catch(e) {
        showError(String(e));
      }
    };

    // Initialise QWebChannel once Qt injects the transport
    document.addEventListener('DOMContentLoaded', function() {
      var attempts = 0;
      var maxAttempts = 50;  // 5 s total
      function tryChannel() {
        attempts++;
        if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
          new QWebChannel(qt.webChannelTransport, function(channel) {
            _setBridge(channel.objects.webexBridge);
          });
        } else if (attempts < maxAttempts) {
          setTimeout(tryChannel, 100);
        }
      }
      tryChannel();
    });
  </script>
</body>
</html>
