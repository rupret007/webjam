# WebJam TURN credential Worker (Cloudflare free plan).
# Secrets are set with `wrangler secret put` and are never committed.
name = "webjam-turn-credentials"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Configurable $0 cap: 800 GB of the 1,000 GB Realtime TURN free allowance.
# 1 GB = 1,000,000,000 bytes (Cloudflare billing unit).
[vars]
TURN_MONTHLY_CAP_GB = "800"
TURN_CREDENTIAL_TTL_SECONDS = "600"
TURN_RATE_LIMIT_PER_MINUTE = "10"
# Exact comma-separated origins; add an exact preview origin when needed.
# HTTP loopback origins additionally require ENVIRONMENT = "development".
CORS_ALLOWED_ORIGINS = "https://stalemate.band"
ENVIRONMENT = "production"
WEB_TURN_MONTHLY_CAP_GB = "200"
WEB_DAILY_REQUESTS = "3000"
MAILBOX_TTL_SECONDS = "600"
MAILBOX_RATE_LIMIT_PER_MINUTE = "30"
MAILBOX_NEW_BUCKETS_PER_MINUTE = "32"
MAILBOX_DAILY_REQUESTS = "10000"
MAILBOX_DAILY_ROW_WRITES = "10000"
MAILBOX_DAILY_GB_S = "1000"
MAILBOX_PREFIX_DAILY_REQUESTS = "200"
MAILBOX_PREFIX_DAILY_ROW_WRITES = "200"
MAILBOX_PREFIX_DAILY_GB_S = "20"
MAILBOX_NET_DAILY_REQUESTS = "2000"
MAILBOX_NET_DAILY_ROW_WRITES = "2000"
MAILBOX_NET_DAILY_GB_S = "200"
MAILBOX_RATE_PREFIX_DAILY = "2000"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "MAILBOX_QUOTA"
class_name = "MailboxQuota"

[[migrations]]
tag = "v1-mailbox"
new_sqlite_classes = ["Mailbox", "MailboxQuota"]

# Required secrets (do not put values here):
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
#   wrangler secret put CLOUDFLARE_ANALYTICS_API_TOKEN
#     (Account Analytics Read; TURN key tokens are rejected with code 10000)
# Web TURN requires a separate key in the same account for attributable usage:
#   wrangler secret put WEB_TURN_KEY_ID
#   wrangler secret put WEB_TURN_KEY_API_TOKEN
# Missing web secrets fail closed (503). Direct ICE does not need TURN secrets.
