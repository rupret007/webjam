# WebJam coturn for ordinary Host/Join TURN fallback.
# Long-lived secret stays in /etc/webjam-turn/secret.env, never in the app binary.
# Matching REST credentials are minted by deploy/relay/turn_credentials.py.

listening-ip=0.0.0.0
listening-port=3478
min-port=49152
max-port=49351
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret is loaded from the systemd EnvironmentFile.
realm=webjam
server-name=webjam-turn
no-tls
no-dtls
no-cli
no-rfc5780
no-stun-backward-compatibility
stale-nonce=600
max-allocate-lifetime=600
total-quota=32
user-quota=2
bps-capacity=0
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
no-stdout-log
log-file=/var/log/webjam-turn/coturn.log
simple-log
verbose
# Set external-ip to this VM's public IPv4 in secret.env or here:
# external-ip=203.0.113.10
