name: Publish Verified WebJam v0.26 Testing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact v0.26.0 annotated candidate tag"
        required: true
        default: v0.26.0
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-webjam-release
  cancel-in-progress: false

env:
  EXPECTED_TAG: v0.26.0
  EXPECTED_VERSION: 0.26.0
  PINNED_TAG_OBJECT: 3989baadaaa00b4655115e23cf900ea2c1c7fd4c
  PINNED_TAG_COMMIT: 4b5208098981943df8ddaf1fac31aa36c15146bb
  PINNED_TAG_CI_RUN_ID: 31973256062
  PINNED_TAG_CI_RUN_ATTEMPT: 1
  PINNED_RELEASE_ID: 371442375
  PINNED_INVENTORY_SHA256: e6c49c6568877961ce484fa9dc477d8939c8bf881dfd568497da5752199d3aa3
  PINNED_BODY_SHA256: 404c5378017a37df6c5813d39348d16c386492a7acccd23797a3659495dea4da
  PINNED_CHECKSUM_SHA256: c5c9e07c33ac74a62110ef60442fe8994cc4512adfe6dfe70a43d1986da7d77e
  PINNED_INVENTORY_JSON: >-
    [{"id":517251779,"name":"WebJam-linux-x64.zip","size":168211648,"digest":"sha256:9b7216fa8591de0edb5e34dc45bb0b1a59e413bf9572c8e7c6c3c018ef72082e"},
    {"id":517251778,"name":"WebJam-macos-arm64-ADHOC-TEST-ONLY.zip","size":216225400,"digest":"sha256:9c92fa23ba334166b5d3fac6f26965d3a59519af6707f3f7fb5c2abdca04a80b"},
    {"id":517251781,"name":"WebJam-macos-x64-ADHOC-TEST-ONLY.zip","size":222536890,"digest":"sha256:e3d3a1875cedcd232fba6ed4ba22d99e8016d6bd717736f4b66c9757c3691da3"},
    {"id":517251780,"name":"WebJam-v0.26.0-macos-arm64-ADHOC-TEST-ONLY.dmg","size":217302612,"digest":"sha256:92ea140b1f5f820cae525f35b76e68af7c3d8a8d4fb330f200a3c40ec6659163"},
    {"id":517251786,"name":"WebJam-v0.26.0-macos-x64-ADHOC-TEST-ONLY.dmg","size":223532070,"digest":"sha256:043339f5f45858ab7eec0df0a884a50acd841056103303e320108f2f8b9abbe7"},
    {"id":517251782,"name":"WebJam-v0.26.0-SHA256SUMS.txt","size":749,"digest":"sha256:c5c9e07c33ac74a62110ef60442fe8994cc4512adfe6dfe70a43d1986da7d77e"},
    {"id":517251783,"name":"WebJam-v0.26.0-windows-x64-UNSIGNED-TEST-ONLY-setup.exe","size":144846325,"digest":"sha256:a3ec7711500836ced1bd0168107c441ef88681f1d48f770e31188cc9ed01b03d"},
    {"id":517251787,"name":"WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip","size":165555420,"digest":"sha256:0a1df1d8868e3b687824b84ff0bf75af2d1b07ba4fdb2bc0e0870e530658df32"}]
  PREVIOUS_LATEST_TAG: v0.25.0
  PREVIOUS_LATEST_RELEASE_ID: 371028390
  PREVIOUS_LATEST_PUBLISHED_AT: "2026-08-15T11:45:43Z"
  PREVIOUS_LATEST_INVENTORY_SHA256: 4afae8ce6f9df58e7ce153756cabfafdaa7258ca0680f741315500d69962e917
  PREVIOUS_LATEST_BODY_SHA256: f4d83872e4ea482dcb4c0bc330675b8e14de70304bfe8086e1bfd9c5d42dd5bd
  V0225_TAG_OBJECT: 88d48b518c582fdc219efa8d62bf996b625372df
  V0225_TAG_COMMIT: d7d0039759e8334407fe2e6ed9e42edf0d7ef639
  SEALED_COMPONENT_TAG: jamulus-components-v3
  SEALED_COMPONENT_SEQUENCE: 6
  SEALED_COMPONENT_URL: https://github.com/rupret007/webjam/releases/download/jamulus-components-v3/WebJam-Jamulus-components-v1.json

jobs:
  prove-candidate:
    name: Prove exact fallback-only v0.26 candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag_object: ${{ steps.source.outputs.tag_object }}
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      master_commit: ${{ steps.source.outputs.master_commit }}
      tag_ci_run_id: ${{ steps.candidate.outputs.tag_ci_run_id }}
      tag_ci_run_attempt: ${{ steps.candidate.outputs.tag_ci_run_attempt }}
    steps:
      - name: Checkout release-control source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact immutable v0.26 source identity
        id: source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" == "$EXPECTED_TAG" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master"
          master_commit="$(git rev-parse refs/remotes/origin/master)"
          [[ "$(git rev-parse HEAD)" == "$master_commit" ]]
          tag_ref="refs/webjam-release-tags/$EXPECTED_TAG"
          git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:$tag_ref"
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          [[ "$tag_object" == "$PINNED_TAG_OBJECT" ]]
          [[ "$tag_commit" == "$PINNED_TAG_COMMIT" ]]
          git merge-base --is-ancestor "$tag_commit" "$master_commit"
          [[ "$(git ls-remote --refs origin "refs/tags/$EXPECTED_TAG" \
            | awk 'NR == 1 {print $1}')" == "$tag_object" ]]
          historical_ref="refs/webjam-historical-tags/v0.22.5"
          git fetch --no-tags origin "refs/tags/v0.22.5:$historical_ref"
          [[ "$(git cat-file -t "$historical_ref")" == "tag" ]]
          [[ "$(git rev-parse "$historical_ref")" == "$V0225_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${historical_ref}^{commit}")" == \
            "$V0225_TAG_COMMIT" ]]
          [[ "$(git ls-remote --refs origin refs/tags/v0.22.5 \
            | awk 'NR == 1 {print $1}')" == "$V0225_TAG_OBJECT" ]]
          tagged_source="$RUNNER_TEMP/v026-source"
          mkdir "$tagged_source"
          git archive "$tag_commit" | tar -x -C "$tagged_source"
          packaged_version="$(sed -n \
            's/^__version__ = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' \
            "$tagged_source/webjam_qt/__init__.py")"
          [[ "$packaged_version" == "$EXPECTED_VERSION" ]]
          grep -Fq 'EMBEDDED_FALLBACK_VERSION = "3.12.2"' \
            "$tagged_source/services/jamulus_component_update.py"
          grep -Fq 'jamulus-components-v3/WebJam-Jamulus-components-v1.json' \
            "$tagged_source/services/jamulus_component_update.py"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "master_commit=$master_commit" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned catalog-verification runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Prove sealed v0.22.5 catalog rejection and baked fallback policy
        shell: bash
        run: |
          set -euo pipefail
          tagged_source="$RUNNER_TEMP/v026-source"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement \
            "$tagged_source/requirements-lock/component-catalog-verifier-linux-x64.txt"
          python -m pip check
          catalog="$RUNNER_TEMP/sealed-v3-catalog.json"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "$catalog" "$SEALED_COMPONENT_URL"
          historical_source="$RUNNER_TEMP/v0225-source"
          mkdir "$historical_source"
          git archive "$V0225_TAG_COMMIT" \
            | tar -x -C "$historical_source"
          (
            cd "$historical_source"
            python -m tools.verify_jamulus_component_catalog \
              --webjam-version 0.22.5 \
              --minimum-sequence "$SEALED_COMPONENT_SEQUENCE" \
              "$catalog" > "$RUNNER_TEMP/v0225-catalog-proof.json"
          )
          jq -e '
            .sequence == 6
            and .webjam_version == "0.22.5"
            and .component_count == 8
          ' "$RUNNER_TEMP/v0225-catalog-proof.json" >/dev/null
          if (
            cd "$tagged_source"
            python -m tools.verify_jamulus_component_catalog \
              --webjam-version "$EXPECTED_VERSION" \
              --minimum-sequence "$SEALED_COMPONENT_SEQUENCE" \
              "$catalog" >/dev/null 2>&1
          ); then
            echo "Sealed v0.22.5 catalog unexpectedly authorized v0.26.0." >&2
            exit 1
          fi
          (
            cd "$tagged_source"
            python - <<'PY'
          import os

          from core.jamulus_compatibility import (
              ComponentTarget,
              JamulusRole,
              official_jamulus_compatibility_registry,
          )

          registry = official_jamulus_compatibility_registry()
          required = {
              (target, role)
              for target in ComponentTarget
              for role in (JamulusRole.CLIENT, JamulusRole.SERVER)
          }
          required.add((ComponentTarget.LINUX_X64, JamulusRole.HEADLESS))
          for target, role in required:
              entries = registry.compatible(
                  role=role,
                  target=target,
                  webjam_version=os.environ["EXPECTED_VERSION"],
              )
              versions = {entry.version for entry in entries}
              assert {"3.12.2", "3.12.3"}.issubset(versions)
          PY
          )

      - name: Bind the unique successful tag CI and exact attempt
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.source.outputs.tag_commit }}
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$EXPECTED_TAG&event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/tag-ci-pages.json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$EXPECTED_TAG" \
            --arg commit "$TAG_COMMIT" \
            --argjson run_id "$PINNED_TAG_CI_RUN_ID" \
            --argjson run_attempt "$PINNED_TAG_CI_RUN_ATTEMPT" \
            '
              [
                .[].workflow_runs[]
                | select(
                    .path == ".github/workflows/ci.yml"
                    and .event == "push"
                    and .head_branch == $tag
                    and .head_sha == $commit
                    and .head_repository.full_name == $repo
                    and .repository.full_name == $repo
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] as $matches
              | if ($matches | length) != 1 then
                  error("expected one unique successful v0.26.0 tag CI run")
                elif $matches[0].id != $run_id then
                  error("successful v0.26.0 tag CI run ID changed")
                elif $matches[0].run_attempt != $run_attempt then
                  error("successful v0.26.0 tag CI attempt changed")
                else
                  $matches[0]
                end
            ' "$RUNNER_TEMP/tag-ci-pages.json" \
            > "$RUNNER_TEMP/tag-ci.json"
          tag_ci_run_id="$(jq -r '.id' "$RUNNER_TEMP/tag-ci.json")"
          tag_ci_run_attempt="$(jq -r '.run_attempt' "$RUNNER_TEMP/tag-ci.json")"
          [[ "$tag_ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$tag_ci_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$tag_ci_run_id" == "$PINNED_TAG_CI_RUN_ID" ]]
          [[ "$tag_ci_run_attempt" == "$PINNED_TAG_CI_RUN_ATTEMPT" ]]
          echo "tag_ci_run_id=$tag_ci_run_id" >> "$GITHUB_OUTPUT"
          echo "tag_ci_run_attempt=$tag_ci_run_attempt" >> "$GITHUB_OUTPUT"

  publish-latest:
    name: Publish exact v0.26.0 draft as Latest
    needs: prove-candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    environment:
      name: release-latest
    steps:
      - name: Checkout release-control source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate source, immutable previous Latest, draft, and bytes
        id: revalidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs['prove-candidate'].outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs['prove-candidate'].outputs.tag_commit }}
          EXPECTED_MASTER_COMMIT: ${{ needs['prove-candidate'].outputs.master_commit }}
          EXPECTED_TAG_CI_RUN_ID: ${{ needs['prove-candidate'].outputs.tag_ci_run_id }}
          EXPECTED_TAG_CI_RUN_ATTEMPT: ${{ needs['prove-candidate'].outputs.tag_ci_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" == "$EXPECTED_TAG" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_TAG_CI_RUN_ID" == "$PINNED_TAG_CI_RUN_ID" ]]
          [[ "$EXPECTED_TAG_CI_RUN_ATTEMPT" == "$PINNED_TAG_CI_RUN_ATTEMPT" ]]
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master"
          tag_ref="refs/webjam-release-tags/$EXPECTED_TAG"
          git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:$tag_ref"
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          [[ "$(git rev-parse "$tag_ref")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${tag_ref}^{commit}")" == "$EXPECTED_TAG_COMMIT" ]]
          [[ "$(git rev-parse refs/remotes/origin/master)" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_TAG_OBJECT" == "$PINNED_TAG_OBJECT" ]]
          [[ "$EXPECTED_TAG_COMMIT" == "$PINNED_TAG_COMMIT" ]]
          git merge-base --is-ancestor \
            "$EXPECTED_TAG_COMMIT" "$EXPECTED_MASTER_COMMIT"
          [[ "$(git ls-remote --refs origin "refs/tags/$EXPECTED_TAG" \
            | awk 'NR == 1 {print $1}')" == "$EXPECTED_TAG_OBJECT" ]]

          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$EXPECTED_TAG&event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/revalidated-tag-ci-pages.json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$EXPECTED_TAG" \
            --arg commit "$EXPECTED_TAG_COMMIT" \
            --argjson run_id "$PINNED_TAG_CI_RUN_ID" \
            --argjson run_attempt "$PINNED_TAG_CI_RUN_ATTEMPT" \
            '
              [
                .[].workflow_runs[]
                | select(
                    .path == ".github/workflows/ci.yml"
                    and .event == "push"
                    and .head_branch == $tag
                    and .head_sha == $commit
                    and .head_repository.full_name == $repo
                    and .repository.full_name == $repo
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] as $matches
              | ($matches | length) == 1
                and $matches[0].id == $run_id
                and $matches[0].run_attempt == $run_attempt
            ' "$RUNNER_TEMP/revalidated-tag-ci-pages.json" >/dev/null

          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/previous-latest.json"
          previous_body_sha256="$(jq -j '.body' \
            "$RUNNER_TEMP/previous-latest.json" | sha256sum | awk '{print $1}')"
          [[ "$previous_body_sha256" == "$PREVIOUS_LATEST_BODY_SHA256" ]]
          previous_inventory_sha256="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/previous-latest.json" | sha256sum | awk '{print $1}')"
          [[ "$previous_inventory_sha256" == \
            "$PREVIOUS_LATEST_INVENTORY_SHA256" ]]
          jq -e \
            --arg tag "$PREVIOUS_LATEST_TAG" \
            --arg published_at "$PREVIOUS_LATEST_PUBLISHED_AT" \
            --argjson release_id "$PREVIOUS_LATEST_RELEASE_ID" \
            '
              .id == $release_id
              and .tag_name == $tag
              and .name == "WebJam v0.25.0 — unsigned private test candidate."
              and .draft == false
              and .prerelease == false
              and .immutable == true
              and .published_at == $published_at
              and (.assets | length) == 8
              and ([.assets[].id] | unique | length) == 8
              and all(
                .assets[];
                .size > 0
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$RUNNER_TEMP/previous-latest.json" >/dev/null

          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages.json"
          expected_assets="$(jq -cn --arg version "$EXPECTED_VERSION" '[
            "WebJam-linux-x64.zip",
            "WebJam-macos-arm64-ADHOC-TEST-ONLY.zip",
            "WebJam-macos-x64-ADHOC-TEST-ONLY.zip",
            ("WebJam-v" + $version + "-macos-arm64-ADHOC-TEST-ONLY.dmg"),
            ("WebJam-v" + $version + "-macos-x64-ADHOC-TEST-ONLY.dmg"),
            ("WebJam-v" + $version + "-windows-x64-UNSIGNED-TEST-ONLY-setup.exe"),
            "WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip",
            ("WebJam-v" + $version + "-SHA256SUMS.txt")
          ] | sort')"
          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --argjson release_id "$PINNED_RELEASE_ID" \
            --argjson expected_assets "$expected_assets" \
            --arg expected_name \
              "WebJam v${EXPECTED_VERSION} — unsigned private test candidate." \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("v0.26.0 draft identity changed")
                elif (
                  $matches[0].id != $release_id
                  or $matches[0].draft != true
                  or $matches[0].prerelease != false
                  or $matches[0].immutable != false
                  or $matches[0].published_at != null
                  or $matches[0].target_commitish != "master"
                  or $matches[0].name != $expected_name
                  or ($matches[0].body | contains("unsigned private test candidate") | not)
                  or ($matches[0].body | contains("NOT RUN") | not)
                  or ($matches[0].body | contains("keeps the reviewed embedded Jamulus 3.12.2") | not)
                  or ($matches[0].body | contains("fallback.") | not)
                  or ([ $matches[0].assets[].name ] | sort) != $expected_assets
                  or ([ $matches[0].assets[].id ] | unique | length) != 8
                  or any(
                    $matches[0].assets[];
                    .id <= 0
                    or .size <= 0
                    or (.digest | test("^sha256:[0-9a-f]{64}$") | not)
                  )
                ) then
                  error("v0.26.0 draft or asset inventory changed")
                else
                  $matches[0]
                end
            ' "$RUNNER_TEMP/release-pages.json" \
            > "$RUNNER_TEMP/draft.json"
          body_sha256="$(jq -j '.body' "$RUNNER_TEMP/draft.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$body_sha256" == "$PINNED_BODY_SHA256" ]]
          expected_inventory="$(jq -ce 'sort_by(.name)' \
            <<< "$PINNED_INVENTORY_JSON")"
          actual_inventory="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/draft.json")"
          [[ "$actual_inventory" == "$expected_inventory" ]]
          inventory_sha256="$(printf '%s\n' "$actual_inventory" \
            | sha256sum | awk '{print $1}')"
          [[ "$inventory_sha256" == "$PINNED_INVENTORY_SHA256" ]]
          checksum_digest="$(jq -r --arg checksum \
            "WebJam-v${EXPECTED_VERSION}-SHA256SUMS.txt" \
            '.assets[] | select(.name == $checksum) | .digest' \
            "$RUNNER_TEMP/draft.json")"
          [[ "$checksum_digest" == "sha256:$PINNED_CHECKSUM_SHA256" ]]
          mkdir "$RUNNER_TEMP/release-assets"
          jq -r '.assets[] | [.id, .name, .digest] | @tsv' \
            "$RUNNER_TEMP/draft.json" \
            | while IFS=$'\t' read -r asset_id name digest; do
                target="$RUNNER_TEMP/release-assets/$name"
                gh api \
                  -H "Accept: application/octet-stream" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  > "$target"
                [[ -s "$target" && ! -L "$target" ]]
                [[ "sha256:$(sha256sum -- "$target" | awk '{print $1}')" == \
                  "$digest" ]]
              done
          cd "$RUNNER_TEMP/release-assets"
          checksum="WebJam-v${EXPECTED_VERSION}-SHA256SUMS.txt"
          [[ "$(sha256sum -- "$checksum" | awk '{print $1}')" == \
            "$PINNED_CHECKSUM_SHA256" ]]
          [[ "$(wc -l < "$checksum")" -eq 7 ]]
          sha256sum --check --strict "$checksum"

      - name: Publish immutable v0.26.0 private test candidate as Latest
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs['prove-candidate'].outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs['prove-candidate'].outputs.tag_commit }}
          EXPECTED_MASTER_COMMIT: ${{ needs['prove-candidate'].outputs.master_commit }}
          EXPECTED_TAG_CI_RUN_ID: ${{ needs['prove-candidate'].outputs.tag_ci_run_id }}
          EXPECTED_TAG_CI_RUN_ATTEMPT: ${{ needs['prove-candidate'].outputs.tag_ci_run_attempt }}
        run: |
          set -euo pipefail

          # The full byte gate above can take long enough for a draft, tag, or
          # branch to change. Re-read every mutable identity in this same shell
          # immediately before the only write so post-publication checks never
          # become the first place a race is detected.
          [[ "$REQUESTED_TAG" == "$EXPECTED_TAG" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_TAG_OBJECT" == "$PINNED_TAG_OBJECT" ]]
          [[ "$EXPECTED_TAG_COMMIT" == "$PINNED_TAG_COMMIT" ]]
          [[ "$EXPECTED_TAG_CI_RUN_ID" == "$PINNED_TAG_CI_RUN_ID" ]]
          [[ "$EXPECTED_TAG_CI_RUN_ATTEMPT" == \
            "$PINNED_TAG_CI_RUN_ATTEMPT" ]]

          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$EXPECTED_TAG&event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/final-tag-ci-pages.json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$EXPECTED_TAG" \
            --arg commit "$EXPECTED_TAG_COMMIT" \
            --argjson run_id "$PINNED_TAG_CI_RUN_ID" \
            --argjson run_attempt "$PINNED_TAG_CI_RUN_ATTEMPT" \
            '
              [
                .[].workflow_runs[]
                | select(
                    .path == ".github/workflows/ci.yml"
                    and .event == "push"
                    and .head_branch == $tag
                    and .head_sha == $commit
                    and .head_repository.full_name == $repo
                    and .repository.full_name == $repo
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] as $matches
              | ($matches | length) == 1
                and $matches[0].id == $run_id
                and $matches[0].run_attempt == $run_attempt
            ' "$RUNNER_TEMP/final-tag-ci-pages.json" >/dev/null

          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/final-previous-latest.json"
          final_previous_body_sha256="$(jq -j '.body' \
            "$RUNNER_TEMP/final-previous-latest.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$final_previous_body_sha256" == \
            "$PREVIOUS_LATEST_BODY_SHA256" ]]
          final_previous_inventory_sha256="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/final-previous-latest.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$final_previous_inventory_sha256" == \
            "$PREVIOUS_LATEST_INVENTORY_SHA256" ]]
          jq -e \
            --arg tag "$PREVIOUS_LATEST_TAG" \
            --arg published_at "$PREVIOUS_LATEST_PUBLISHED_AT" \
            --argjson release_id "$PREVIOUS_LATEST_RELEASE_ID" \
            '
              .id == $release_id
              and .tag_name == $tag
              and .name == "WebJam v0.25.0 — unsigned private test candidate."
              and .draft == false
              and .prerelease == false
              and .immutable == true
              and .published_at == $published_at
              and (.assets | length) == 8
              and ([.assets[].id] | unique | length) == 8
              and all(
                .assets[];
                .size > 0
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$RUNNER_TEMP/final-previous-latest.json" >/dev/null

          remote_master_commit="$(git ls-remote --refs origin \
            refs/heads/master | awk 'NR == 1 {print $1}')"
          [[ "$remote_master_commit" == "$EXPECTED_MASTER_COMMIT" ]]
          final_tag_ref="refs/webjam-final-release-tags/$EXPECTED_TAG"
          git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:$final_tag_ref"
          [[ "$(git cat-file -t "$final_tag_ref")" == "tag" ]]
          [[ "$(git rev-parse "$final_tag_ref")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${final_tag_ref}^{commit}")" == \
            "$EXPECTED_TAG_COMMIT" ]]
          git merge-base --is-ancestor \
            "$EXPECTED_TAG_COMMIT" "$EXPECTED_MASTER_COMMIT"
          [[ "$(git ls-remote --refs origin "refs/tags/$EXPECTED_TAG" \
            | awk 'NR == 1 {print $1}')" == "$EXPECTED_TAG_OBJECT" ]]

          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/$PINNED_RELEASE_ID" \
            > "$RUNNER_TEMP/final-draft.json"
          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --argjson release_id "$PINNED_RELEASE_ID" \
            --arg expected_name \
              "WebJam v${EXPECTED_VERSION} — unsigned private test candidate." \
            '
              .id == $release_id
              and .tag_name == $tag
              and .target_commitish == "master"
              and .name == $expected_name
              and .draft == true
              and .prerelease == false
              and .immutable == false
              and .published_at == null
              and (.assets | length) == 8
              and ([.assets[].id] | unique | length) == 8
              and all(
                .assets[];
                .state == "uploaded"
                and .size > 0
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$RUNNER_TEMP/final-draft.json" >/dev/null
          final_body_sha256="$(jq -j '.body' "$RUNNER_TEMP/final-draft.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$final_body_sha256" == "$PINNED_BODY_SHA256" ]]
          final_expected_inventory="$(jq -ce 'sort_by(.name)' \
            <<< "$PINNED_INVENTORY_JSON")"
          final_actual_inventory="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/final-draft.json")"
          [[ "$final_actual_inventory" == "$final_expected_inventory" ]]
          final_inventory_sha256="$(printf '%s\n' "$final_actual_inventory" \
            | sha256sum | awk '{print $1}')"
          [[ "$final_inventory_sha256" == "$PINNED_INVENTORY_SHA256" ]]

          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/$PINNED_RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > "$RUNNER_TEMP/published.json"
          body_sha256="$(jq -j '.body' "$RUNNER_TEMP/published.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$body_sha256" == "$PINNED_BODY_SHA256" ]]
          expected_inventory="$(jq -ce 'sort_by(.name)' \
            <<< "$PINNED_INVENTORY_JSON")"
          actual_inventory="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/published.json")"
          [[ "$actual_inventory" == "$expected_inventory" ]]
          inventory_sha256="$(printf '%s\n' "$actual_inventory" \
            | sha256sum | awk '{print $1}')"
          [[ "$inventory_sha256" == "$PINNED_INVENTORY_SHA256" ]]
          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --argjson release_id "$PINNED_RELEASE_ID" \
            --arg expected_name \
              "WebJam v${EXPECTED_VERSION} — unsigned private test candidate." \
            '
              .id == $release_id
              and .tag_name == $tag
              and .target_commitish == "master"
              and .name == $expected_name
              and .draft == false
              and .prerelease == false
              and .immutable == true
              and .published_at != null
              and (.assets | length) == 8
            ' "$RUNNER_TEMP/published.json" >/dev/null

      - name: Redownload and verify immutable GitHub Latest identity and bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/latest.json"
          body_sha256="$(jq -j '.body' "$RUNNER_TEMP/latest.json" \
            | sha256sum | awk '{print $1}')"
          [[ "$body_sha256" == "$PINNED_BODY_SHA256" ]]
          expected_inventory="$(jq -ce 'sort_by(.name)' \
            <<< "$PINNED_INVENTORY_JSON")"
          actual_inventory="$(jq -c \
            '[.assets[] | {id,name,size,digest}] | sort_by(.name)' \
            "$RUNNER_TEMP/latest.json")"
          [[ "$actual_inventory" == "$expected_inventory" ]]
          inventory_sha256="$(printf '%s\n' "$actual_inventory" \
            | sha256sum | awk '{print $1}')"
          [[ "$inventory_sha256" == "$PINNED_INVENTORY_SHA256" ]]
          jq -e \
            --arg tag "$EXPECTED_TAG" \
            --argjson release_id "$PINNED_RELEASE_ID" \
            --arg expected_name \
              "WebJam v${EXPECTED_VERSION} — unsigned private test candidate." \
            '
              .id == $release_id
              and .tag_name == $tag
              and .target_commitish == "master"
              and .name == $expected_name
              and .draft == false
              and .prerelease == false
              and .immutable == true
              and .published_at != null
              and (.assets | length) == 8
            ' "$RUNNER_TEMP/latest.json" >/dev/null
          mkdir "$RUNNER_TEMP/latest-assets"
          jq -r '.assets[] | [.id, .name, .digest] | @tsv' \
            "$RUNNER_TEMP/latest.json" \
            | while IFS=$'\t' read -r asset_id name digest; do
                target="$RUNNER_TEMP/latest-assets/$name"
                gh api \
                  -H "Accept: application/octet-stream" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  > "$target"
                [[ -s "$target" && ! -L "$target" ]]
                [[ "sha256:$(sha256sum -- "$target" | awk '{print $1}')" == \
                  "$digest" ]]
              done
          cd "$RUNNER_TEMP/latest-assets"
          checksum="WebJam-v${EXPECTED_VERSION}-SHA256SUMS.txt"
          [[ "$(sha256sum -- "$checksum" | awk '{print $1}')" == \
            "$PINNED_CHECKSUM_SHA256" ]]
          [[ "$(wc -l < "$checksum")" -eq 7 ]]
          sha256sum --check --strict "$checksum"
