name: Sketch Jam

on:
  pull_request:
    paths:
      - 'web/sketch-jam/**'
      - 'deploy/relay/cloudflare-worker/**'
      - 'tests/fixtures/mailbox-crypto-vectors.json'
      - '.github/workflows/sketch-jam.yml'
  push:
    branches: [master]
    paths:
      - 'web/sketch-jam/**'
      - 'deploy/relay/cloudflare-worker/**'
      - 'tests/fixtures/mailbox-crypto-vectors.json'
      - '.github/workflows/sketch-jam.yml'

permissions:
  contents: read

concurrency:
  group: sketch-jam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/sketch-jam
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/sketch-jam/package-lock.json
      - run: npm ci
      - run: node --test test/*.test.js
        working-directory: deploy/relay/cloudflare-worker
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
