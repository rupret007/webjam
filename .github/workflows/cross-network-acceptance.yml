# Optional two-NAT Host/Join proof. Not a required check.
# Same-LAN must PASS. Cross-network FAIL is a green job only for an honest
# completed guest result (no timeout, crash, missing result, or fake connect).
# On master the two-NAT job is report-only; networking PRs must match the receipt.
name: Cross-network acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "core/network_invite.py"
      - "core/jamulus_endpoint.py"
      - "core/rendezvous_profiles.py"
      - "core/remote_invitation.py"
      - "core/session_transfer.py"
      - "core/session_transfer_runtime.py"
      - "core/host_share_readiness.py"
      - "services/lan_room_guest.py"
      - "services/native_remote_transport.py"
      - "services/remote_session_runtime.py"
      - "services/transport_runtime.py"
      - "services/bridge_service.py"
      - "transport/**"
      - "reference_service/**"
      - "webjam_qt/controllers/room_participant.py"
      - "webjam_qt/invitation_ingress.py"
      - "tools/cross_network_acceptance/**"
      - ".github/workflows/cross-network-acceptance.yml"
      - "docs/CROSS-NETWORK-TEST.md"
      - "docs/REMOTE-SESSIONS-PLAN.md"
      - "docs/adr/0001-remote-session-transport.md"
      - "docs/plans/webjam-remote-joining-decision.md"
      - "tests/test_cross_network_acceptance.py"
      - "tests/test_session_transfer*.py"
      - "tests/test_native_remote*.py"
      - "tests/test_lan_*.py"
      - "tests/test_remote_*.py"
      - "tests/test_host_share_join_flow.py"
      - "tests/test_offline_invite_path.py"

permissions:
  contents: read

concurrency:
  group: cross-network-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  same-lan:
    name: Same-LAN control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install netns, sch_netem, coturn, and Qt
        run: |
          set -euo pipefail
          sudo apt-get update
          KERNEL="$(uname -r)"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            iproute2 iptables iputils-ping kmod \
            coturn \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libportaudio2 \
            libpulse0
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "linux-modules-extra-${KERNEL}" \
            || sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              linux-modules-extra-azure \
            || true
          sudo systemctl stop coturn || true
          sudo systemctl disable coturn || true
          sudo systemctl mask coturn || true
          sudo modprobe sch_netem
          lsmod | grep -E '^sch_netem'
          sudo sysctl -w net.ipv4.ip_forward=1
          PROBE="wjxci$$"
          sudo ip netns add "$PROBE"
          sudo ip netns exec "$PROBE" true
          sudo ip netns delete "$PROBE"
          command -v turnserver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -r requirements.txt
          pip install pytest "ruff==0.15.22"

      - name: Lint the harness
        run: ruff check tools/cross_network_acceptance tests/test_cross_network_acceptance.py

      - name: Run same-LAN control
        run: |
          python -m tools.cross_network_acceptance run --case same-lan \
            --output-dir out/cross-network-acceptance \
            --sha "$(git rev-parse HEAD)" --no-netem --expected-status PASS

      - name: Make receipts readable by the runner
        if: always()
        run: |
          if [ -d out/cross-network-acceptance ]; then
            sudo chown -R "$(id -u):$(id -g)" out/cross-network-acceptance
          fi

      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webjam-same-lan-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cross-network-acceptance/
          if-no-files-found: warn
          retention-days: 14

  cross-network:
    name: Cross-network (two NATs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only on master. Networking PRs must match the expected receipt.
    continue-on-error: ${{ github.ref == 'refs/heads/master' }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install netns, sch_netem, coturn, and Qt
        run: |
          set -euo pipefail
          sudo apt-get update
          KERNEL="$(uname -r)"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            iproute2 iptables iputils-ping kmod \
            coturn \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libportaudio2 \
            libpulse0
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "linux-modules-extra-${KERNEL}" \
            || sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              linux-modules-extra-azure \
            || true
          sudo systemctl stop coturn || true
          sudo systemctl disable coturn || true
          sudo systemctl mask coturn || true
          sudo modprobe sch_netem
          lsmod | grep -E '^sch_netem'
          sudo sysctl -w net.ipv4.ip_forward=1
          PROBE="wjxci$$"
          sudo ip netns add "$PROBE"
          sudo ip netns exec "$PROBE" true
          sudo ip netns delete "$PROBE"
          command -v turnserver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -r requirements.txt
          pip install pytest "ruff==0.15.22"

      - name: Run two-NAT Host/Join (expected FAIL)
        run: |
          python -m tools.cross_network_acceptance run --case cross-network \
            --output-dir out/cross-network-acceptance \
            --sha "$(git rev-parse HEAD)" --netem --expected-status FAIL

      - name: Make receipts readable by the runner
        if: always()
        run: |
          if [ -d out/cross-network-acceptance ]; then
            sudo chown -R "$(id -u):$(id -g)" out/cross-network-acceptance
          fi

      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webjam-cross-network-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cross-network-acceptance/
          if-no-files-found: warn
          retention-days: 14
