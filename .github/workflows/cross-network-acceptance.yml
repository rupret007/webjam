# Optional two-NAT Host/Join proof. Not a required check. Same-LAN must PASS.
# Two-NAT FAIL is green only for a classified failure-to-connect (no
# connected-without-state-exchange or fake connect). Report-only on master.
name: Cross-network acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "core/network_invite.py"
      - "core/session_transfer.py"
      - "services/lan_room_guest.py"
      - "transport/**"
      - "tools/cross_network_acceptance/**"
      - ".github/workflows/cross-network-acceptance.yml"
      - "docs/CROSS-NETWORK-TEST.md"
      - "tests/test_cross_network_acceptance.py"

permissions:
  contents: read

concurrency:
  group: cross-network-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  same-lan:
    name: Same-LAN control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install netns, sch_netem, coturn, and Qt
        run: sudo bash tools/cross_network_acceptance/ci_prep.sh
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" && pip install -r requirements.txt pytest "ruff==0.15.22"

      - name: Lint the harness
        run: ruff check tools/cross_network_acceptance tests/test_cross_network_acceptance.py

      - name: Prove RFC 4787 NAT packet behavior
        run: python -m tools.cross_network_acceptance probe-nat

      - name: Run same-LAN control
        run: >
          python -m tools.cross_network_acceptance run --case same-lan
          --output-dir out/cross-network-acceptance
          --sha "$(git rev-parse HEAD)" --no-netem --expected-status PASS

      - name: Make receipts readable by the runner
        if: always()
        run: if [ -d out/cross-network-acceptance ]; then sudo chown -R "$(id -u):$(id -g)" out/cross-network-acceptance; fi
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webjam-same-lan-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cross-network-acceptance/
          if-no-files-found: warn
          retention-days: 14

  cross-network:
    name: Cross-network (two NATs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only on master. Networking PRs must match the expected receipt.
    continue-on-error: ${{ github.ref == 'refs/heads/master' }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install netns, sch_netem, coturn, and Qt
        run: sudo bash tools/cross_network_acceptance/ci_prep.sh
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" && pip install -r requirements.txt pytest "ruff==0.15.22"

      - name: Run two-NAT Host/Join (expected FAIL)
        run: >
          python -m tools.cross_network_acceptance run --case cross-network
          --output-dir out/cross-network-acceptance
          --sha "$(git rev-parse HEAD)" --netem --expected-status FAIL

      - name: Make receipts readable by the runner
        if: always()
        run: if [ -d out/cross-network-acceptance ]; then sudo chown -R "$(id -u):$(id -g)" out/cross-network-acceptance; fi
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webjam-cross-network-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cross-network-acceptance/
          if-no-files-found: warn
          retention-days: 14
