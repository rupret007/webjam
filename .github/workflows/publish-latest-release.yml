name: Publish Verified WebJam Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing draft candidate tag to publish (for example v0.22.5)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-webjam-release
  cancel-in-progress: false

env:
  V0220_TAG_OBJECT: 663075ec53aab36cc9de5d1b84aaec0b3733290b
  V0220_TAG_COMMIT: bf64c1165486a654d923c4e3cb6ede69e6458320
  COMPONENT_CHANNEL_ANCHOR: b1de2d826afe01d6696677b14c2dd5efafa87b5b
  COMPONENT_CHANNEL_TAG: jamulus-components-v3
  MINIMUM_COMPONENT_CATALOG_SEQUENCE: 6

jobs:
  frozen-package-smoke:
    name: Prove exact frozen package without release-write authority
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      tag_commit: ${{ steps.release.outputs.tag_commit }}
      master_commit: ${{ steps.release.outputs.master_commit }}
      workflow_commit: ${{ steps.release.outputs.workflow_commit }}
      tag_ci_run_id: ${{ steps.tag_build.outputs.run_id }}
      tag_ci_workflow_id: ${{ steps.tag_build.outputs.workflow_id }}
      tag_ci_run_attempt: ${{ steps.tag_build.outputs.run_attempt }}
      release_artifact_bindings: ${{ steps.tag_build.outputs.artifact_bindings }}
      linux_artifact_id: ${{ steps.tag_build.outputs.artifact_id }}
      linux_artifact_digest: ${{ steps.tag_build.outputs.artifact_digest }}
      package_bindings: ${{ steps.packages.outputs.package_bindings }}
      package_bindings_sha256: ${{ steps.packages.outputs.package_bindings_sha256 }}
      linux_package_sha256: ${{ steps.packages.outputs.linux_package_sha256 }}
      component_tag_object: ${{ steps.component.outputs.tag_object }}
      component_tag_commit: ${{ steps.component.outputs.tag_commit }}
      component_release_id: ${{ steps.component.outputs.release_id }}
      component_asset_id: ${{ steps.component.outputs.asset_id }}
      component_asset_digest: ${{ steps.component.outputs.asset_digest }}
      catalog_sequence: ${{ steps.component.outputs.catalog_sequence }}
      catalog_envelope_sha256: ${{ steps.component.outputs.catalog_envelope_sha256 }}
      catalog_payload_sha256: ${{ steps.component.outputs.catalog_payload_sha256 }}
      signer_fingerprint_sha256: ${{ steps.component.outputs.signer_fingerprint_sha256 }}
    steps:
      - name: Checkout release-control source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact immutable release tag and workflow source
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Promotion requires one exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Release promotion must be dispatched from master." >&2
            exit 1
          fi
          workflow_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master"
          master_commit="$(git rev-parse refs/remotes/origin/master)"
          if [[ "$workflow_commit" != "$master_commit" ]]; then
            echo "Dispatched workflow source is not the exact origin/master commit." >&2
            exit 1
          fi
          historical_ref="refs/webjam-historical-tags/v0.22.0"
          git fetch --no-tags origin \
            "refs/tags/v0.22.0:${historical_ref}"
          [[ "$(git cat-file -t "$historical_ref")" == "tag" ]]
          [[ "$(git rev-parse "$historical_ref")" == "$V0220_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${historical_ref}^{commit}")" == \
            "$V0220_TAG_COMMIT" ]]
          [[ "$(git ls-remote --refs origin refs/tags/v0.22.0 \
            | awk 'NR == 1 {print $1}')" == "$V0220_TAG_OBJECT" ]]
          tag_ref="refs/webjam-release-tags/${tag}"
          git fetch --no-tags origin "refs/tags/${tag}:${tag_ref}"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag $tag must be annotated." >&2
            exit 1
          fi
          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "$tag_commit" != "$master_commit" ]]; then
            echo "Release tag $tag is not the exact origin/master commit." >&2
            exit 1
          fi
          remote_tag_object="$(git ls-remote --refs origin \
            "refs/tags/$tag" | awk 'NR == 1 {print $1}')"
          if [[ "$remote_tag_object" != "$tag_object" ]]; then
            echo "Remote release tag identity changed during verification." >&2
            exit 1
          fi
          git checkout --detach "$tag_commit"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]]
          version_source="$(git show "${tag_commit}:webjam_qt/__init__.py")"
          packaged_version="$(sed -n \
            's/^__version__ = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' \
            <<<"$version_source")"
          [[ "$tag" == "v${packaged_version}" ]] || {
            echo "Tag $tag does not match packaged version ${packaged_version:-missing}." >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$packaged_version" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "master_commit=$master_commit" >> "$GITHUB_OUTPUT"
          echo "workflow_commit=$workflow_commit" >> "$GITHUB_OUTPUT"

      - name: Discover and bind the unique successful tag build artifacts
        id: tag_build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
            > "$RUNNER_TEMP/ci-workflow.json"
          jq -e '
            .name == "WebJam CI"
            and .path == ".github/workflows/ci.yml"
            and .state == "active"
            and (.id | type == "number")
            and .id > 0
          ' "$RUNNER_TEMP/ci-workflow.json" >/dev/null
          ci_workflow_id="$(jq -r '.id' "$RUNNER_TEMP/ci-workflow.json")"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$TAG&event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/tag-ci-runs.json"
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$TAG_COMMIT" \
            --argjson workflow_id "$ci_workflow_id" \
            '
              [
                .[].workflow_runs[]
                | select(
                    .path == ".github/workflows/ci.yml"
                    and .workflow_id == $workflow_id
                    and .event == "push"
                    and .head_branch == $tag
                    and .head_sha == $commit
                    and .status == "completed"
                    and .conclusion == "success"
                    and (.id | type == "number")
                    and .id > 0
                    and (.workflow_id | type == "number")
                    and .workflow_id > 0
                    and (.run_attempt | type == "number")
                    and .run_attempt >= 1
                  )
              ] as $matches
              | if ($matches | length) != 1 then
                  error("expected exactly one successful tag CI run")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/tag-ci-runs.json" \
            > "$RUNNER_TEMP/tag-ci-run.json"
          run_id="$(jq -r '.id' "$RUNNER_TEMP/tag-ci-run.json")"
          workflow_id="$(jq -r '.workflow_id' "$RUNNER_TEMP/tag-ci-run.json")"
          run_attempt="$(jq -r '.run_attempt' "$RUNNER_TEMP/tag-ci-run.json")"
          [[ "$workflow_id" == "$ci_workflow_id" ]]
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$RUNNER_TEMP/tag-ci-artifact-pages.json"
          jq -e \
            --arg tag "$TAG" \
            --arg commit "$TAG_COMMIT" \
            --argjson run_id "$run_id" \
            '
              [
                "webjam-windows-x64",
                "webjam-macos-arm64",
                "webjam-macos-x64",
                "webjam-linux-x64"
              ] as $expected
              | [
                  .[].artifacts[]
                  | select(.name as $name | $expected | index($name))
                ] as $matches
              | if (
                  ($matches | length) != ($expected | length)
                  or ([$matches[].name] | unique | length) != ($expected | length)
                  or ([$matches[].id] | unique | length) != ($expected | length)
                  or ([$matches[].digest] | unique | length) != ($expected | length)
                  or any(
                    $matches[];
                    (.id | type != "number")
                    or .id <= 0
                    or .expired != false
                    or (.size_in_bytes | type != "number")
                    or .size_in_bytes <= 0
                    or (.digest | type != "string")
                    or (.digest | test("^sha256:[0-9a-f]{64}$") | not)
                    or .workflow_run.id != $run_id
                    or .workflow_run.head_branch != $tag
                    or .workflow_run.head_sha != $commit
                  )
                ) then
                  error("tag CI release artifact identities are not exact")
                else
                  $matches
                  | map({
                      name,
                      id,
                      digest,
                      size_in_bytes
                    })
                  | sort_by(.name)
                end
            ' \
            "$RUNNER_TEMP/tag-ci-artifact-pages.json" \
            > "$RUNNER_TEMP/release-artifact-bindings.json"
          artifact_bindings="$(jq -c . \
            "$RUNNER_TEMP/release-artifact-bindings.json")"
          linux_artifact_id="$(jq -r \
            '.[] | select(.name == "webjam-linux-x64") | .id' \
            "$RUNNER_TEMP/release-artifact-bindings.json")"
          linux_artifact_digest="$(jq -r \
            '.[] | select(.name == "webjam-linux-x64") | .digest' \
            "$RUNNER_TEMP/release-artifact-bindings.json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact_bindings=$artifact_bindings" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$linux_artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$linux_artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Python for signed component-catalog verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install hash-locked component-catalog verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement \
            requirements-lock/component-catalog-verifier-linux-x64.txt
          python -m pip check

      - name: Verify and bind the live signed Jamulus catalog
        id: component
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_DESKTOP_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          component_tag="$COMPONENT_CHANNEL_TAG"
          component_asset="WebJam-Jamulus-components-v1.json"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/public-release-pages.json"
          component_tag_ref="refs/webjam-component-tags/$component_tag"
          git fetch --no-tags origin \
            "refs/tags/${component_tag}:${component_tag_ref}"
          component_tag_type="$(git cat-file -t "$component_tag_ref")"
          if [[ "$component_tag_type" != "commit" ]]; then
            echo "Component channel tag must remain the reviewed lightweight tag." >&2
            exit 1
          fi
          component_tag_object="$(git rev-parse "$component_tag_ref")"
          component_tag_commit="$(git rev-parse "${component_tag_ref}^{commit}")"
          if [[ "$component_tag_object" != "$COMPONENT_CHANNEL_ANCHOR" || \
                "$component_tag_commit" != "$COMPONENT_CHANNEL_ANCHOR" ]]; then
            echo "Component channel tag moved from its reviewed immutable anchor." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor \
            "$component_tag_commit" "$EXPECTED_DESKTOP_COMMIT"; then
            echo "Desktop release does not descend from the component channel anchor." >&2
            exit 1
          fi
          remote_component_tag_object="$(git ls-remote --refs origin \
            "refs/tags/$component_tag" | awk 'NR == 1 {print $1}')"
          [[ "$remote_component_tag_object" == "$component_tag_object" ]]
          jq -e \
            --arg tag "$component_tag" \
            --arg asset "$component_asset" \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("expected exactly one live component release")
                elif (
                  $matches[0].draft != false
                  or $matches[0].prerelease != true
                  or ($matches[0].assets | length) != 1
                  or $matches[0].assets[0].name != $asset
                  or $matches[0].assets[0].size <= 0
                ) then
                  error("component release state or asset inventory is invalid")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/public-release-pages.json" \
            > "$RUNNER_TEMP/component-release-smoke.json"
          latest_tag="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          [[ "$latest_tag" != "$component_tag" ]]
          component_release_id="$(jq -r '.id' \
            "$RUNNER_TEMP/component-release-smoke.json")"
          component_asset_id="$(jq -r '.assets[0].id' \
            "$RUNNER_TEMP/component-release-smoke.json")"
          component_asset_digest="$(jq -r '.assets[0].digest' \
            "$RUNNER_TEMP/component-release-smoke.json")"
          [[ "$component_release_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$component_asset_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$component_asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/component-catalog-smoke"
          catalog="$RUNNER_TEMP/component-catalog-smoke/$component_asset"
          gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$component_asset_id" \
            > "$catalog"
          [[ -s "$catalog" && ! -L "$catalog" ]]
          catalog_envelope_sha256="$(sha256sum -- "$catalog" | awk '{print $1}')"
          [[ "sha256:$catalog_envelope_sha256" == "$component_asset_digest" ]]
          python -m tools.verify_jamulus_component_catalog \
            --webjam-version "$VERSION" \
            --minimum-sequence "$MINIMUM_COMPONENT_CATALOG_SEQUENCE" \
            "$catalog" \
            > "$RUNNER_TEMP/component-catalog-verification-smoke.json"
          jq -e \
            --arg version "$VERSION" \
            --argjson minimum "$MINIMUM_COMPONENT_CATALOG_SEQUENCE" \
            '
              .sequence == $minimum
              and .webjam_version == $version
              and .component_count == 8
            ' \
            "$RUNNER_TEMP/component-catalog-verification-smoke.json" \
            >/dev/null
          catalog_sequence="$(jq -r '.sequence' \
            "$RUNNER_TEMP/component-catalog-verification-smoke.json")"
          catalog_payload_sha256="$(jq -r '.payload_sha256' \
            "$RUNNER_TEMP/component-catalog-verification-smoke.json")"
          signer_fingerprint_sha256="$(jq -r '.signer_fingerprint_sha256' \
            "$RUNNER_TEMP/component-catalog-verification-smoke.json")"
          [[ "$catalog_payload_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$signer_fingerprint_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "tag_object=$component_tag_object" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$component_tag_commit" >> "$GITHUB_OUTPUT"
          echo "release_id=$component_release_id" >> "$GITHUB_OUTPUT"
          echo "asset_id=$component_asset_id" >> "$GITHUB_OUTPUT"
          echo "asset_digest=$component_asset_digest" >> "$GITHUB_OUTPUT"
          echo "catalog_sequence=$catalog_sequence" >> "$GITHUB_OUTPUT"
          echo "catalog_envelope_sha256=$catalog_envelope_sha256" >> "$GITHUB_OUTPUT"
          echo "catalog_payload_sha256=$catalog_payload_sha256" >> "$GITHUB_OUTPUT"
          echo "signer_fingerprint_sha256=$signer_fingerprint_sha256" >> "$GITHUB_OUTPUT"

      - name: Download and bind the exact tag-build release packages
        id: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_BINDINGS: ${{ steps.tag_build.outputs.artifact_bindings }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/tag-build-artifacts"
          package_dir="$RUNNER_TEMP/frozen-packages"
          mkdir "$archive_dir" "$package_dir"
          jq -e '
            (type == "array")
            and length == 4
            and all(
              .[];
              (.name | type == "string")
              and (.id | type == "number")
              and .id > 0
              and (.digest | type == "string")
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.size_in_bytes | type == "number")
              and .size_in_bytes > 0
            )
          ' <<<"$ARTIFACT_BINDINGS" >/dev/null
          while IFS=$'\t' read -r name artifact_id digest artifact_size; do
            [[ "$name" =~ ^webjam-(windows-x64|macos-arm64|macos-x64|linux-x64)$ ]]
            artifact_archive="$archive_dir/${name}.zip"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$artifact_archive"
            [[ -s "$artifact_archive" && ! -L "$artifact_archive" ]]
            [[ "$(stat -c '%s' "$artifact_archive")" == "$artifact_size" ]]
            artifact_sha256="$(sha256sum -- "$artifact_archive" | awk '{print $1}')"
            [[ "sha256:$artifact_sha256" == "$digest" ]]
          done < <(
            jq -r \
              '.[] | [.name, (.id | tostring), .digest, (.size_in_bytes | tostring)] | @tsv' \
              <<<"$ARTIFACT_BINDINGS"
          )
          python - "$archive_dir" "$package_dir" "$VERSION" <<'PY'
          from __future__ import annotations

          import pathlib
          import stat
          import sys
          import zipfile

          archive_dir = pathlib.Path(sys.argv[1])
          target_dir = pathlib.Path(sys.argv[2])
          version = sys.argv[3]
          maximum_member_size = 2 * 1024 * 1024 * 1024
          maximum_artifact_size = 4 * 1024 * 1024 * 1024
          expected = {
              "webjam-linux-x64": {
                  "WebJam-linux-x64.zip",
              },
              "webjam-macos-arm64": {
                  "WebJam-macos-arm64-ADHOC-TEST-ONLY.zip",
                  f"WebJam-v{version}-macos-arm64-ADHOC-TEST-ONLY.dmg",
              },
              "webjam-macos-x64": {
                  "WebJam-macos-x64-ADHOC-TEST-ONLY.zip",
                  f"WebJam-v{version}-macos-x64-ADHOC-TEST-ONLY.dmg",
              },
              "webjam-windows-x64": {
                  "WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip",
                  f"WebJam-v{version}-windows-x64-UNSIGNED-TEST-ONLY-setup.exe",
                  f"WebJam-v{version}-windows-x64-SHA256SUMS.txt",
              },
          }
          for artifact_name, expected_names in expected.items():
              source = archive_dir / f"{artifact_name}.zip"
              with zipfile.ZipFile(source) as artifact:
                  members = artifact.infolist()
                  names = [member.filename for member in members]
                  if (
                      len(members) != len(expected_names)
                      or len(names) != len(set(names))
                      or set(names) != expected_names
                  ):
                      raise SystemExit(
                          f"{artifact_name} package inventory is not exact"
                      )
                  total_size = 0
                  for member in members:
                      mode = member.external_attr >> 16
                      total_size += member.file_size
                      if (
                          pathlib.PurePosixPath(member.filename).name
                          != member.filename
                          or member.is_dir()
                          or stat.S_ISLNK(mode)
                          or member.file_size <= 0
                          or member.file_size > maximum_member_size
                          or member.compress_size <= 0
                          or total_size > maximum_artifact_size
                      ):
                          raise SystemExit(
                              f"{artifact_name} package metadata is invalid"
                          )
                      target = target_dir / member.filename
                      with (
                          artifact.open(member, "r") as reader,
                          target.open("xb") as writer,
                      ):
                          while chunk := reader.read(1024 * 1024):
                              writer.write(chunk)
                      if target.stat().st_size != member.file_size:
                          raise SystemExit(
                              f"{artifact_name} package extraction was incomplete"
                          )
          PY
          cd "$package_dir"
          windows_checksum="WebJam-v${VERSION}-windows-x64-SHA256SUMS.txt"
          [[ "$(wc -l < "$windows_checksum")" -eq 2 ]]
          sha256sum --check --strict "$windows_checksum"
          rm -- "$windows_checksum"
          expected=(
            "WebJam-linux-x64.zip"
            "WebJam-macos-arm64-ADHOC-TEST-ONLY.zip"
            "WebJam-macos-x64-ADHOC-TEST-ONLY.zip"
            "WebJam-v${VERSION}-macos-arm64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-macos-x64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-windows-x64-UNSIGNED-TEST-ONLY-setup.exe"
            "WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip"
          )
          mapfile -t actual < <(
            find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t wanted < <(
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort
          )
          diff -u \
            <(printf '%s\n' "${wanted[@]}") \
            <(printf '%s\n' "${actual[@]}")
          : > "$RUNNER_TEMP/package-binding-lines.jsonl"
          for package in "${expected[@]}"; do
            [[ -s "$package" && ! -L "$package" ]]
            package_sha256="$(sha256sum -- "$package" | awk '{print $1}')"
            package_size="$(stat -c '%s' "$package")"
            jq -cn \
              --arg name "$package" \
              --arg sha256 "$package_sha256" \
              --argjson size "$package_size" \
              '{name: $name, sha256: $sha256, size: $size}' \
              >> "$RUNNER_TEMP/package-binding-lines.jsonl"
          done
          jq -sc 'sort_by(.name)' \
            "$RUNNER_TEMP/package-binding-lines.jsonl" \
            > "$RUNNER_TEMP/package-bindings.json"
          jq -e '
            length == 7
            and ([.[].name] | unique | length) == 7
            and all(
              .[];
              (.sha256 | test("^[0-9a-f]{64}$"))
              and .size > 0
            )
          ' "$RUNNER_TEMP/package-bindings.json" >/dev/null
          package_bindings="$(jq -c . \
            "$RUNNER_TEMP/package-bindings.json")"
          package_bindings_sha256="$(printf '%s' "$package_bindings" \
            | sha256sum | awk '{print $1}')"
          linux_package_sha256="$(jq -r \
            '.[] | select(.name == "WebJam-linux-x64.zip") | .sha256' \
            "$RUNNER_TEMP/package-bindings.json")"
          echo "package_bindings=$package_bindings" >> "$GITHUB_OUTPUT"
          echo "package_bindings_sha256=$package_bindings_sha256" \
            >> "$GITHUB_OUTPUT"
          echo "linux_package_sha256=$linux_package_sha256" >> "$GITHUB_OUTPUT"

      - name: Install exact frozen-package smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            libasound2 libbrotli1 libcups2 libdbus-1-3 libegl1 \
            libfontconfig1 libfreetype6 libgbm1 libgl1 libglib2.0-0 \
            libgtk-3-0 libnspr4 libnss3 libportaudio2 libpulse0 libtiff5 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
            libxkbcommon-x11-0 libxkbfile1 libxrandr2 libxtst6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Require live catalog proof from exact frozen Linux package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CATALOG_SEQUENCE: ${{ steps.component.outputs.catalog_sequence }}
          CATALOG_ENVELOPE_SHA256: ${{ steps.component.outputs.catalog_envelope_sha256 }}
          CATALOG_PAYLOAD_SHA256: ${{ steps.component.outputs.catalog_payload_sha256 }}
          SIGNER_FINGERPRINT_SHA256: ${{ steps.component.outputs.signer_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          python tests/support/run_frozen_component_catalog_smoke.py \
            --archive "$RUNNER_TEMP/frozen-packages/WebJam-linux-x64.zip" \
            --expected-version "$VERSION" \
            --expected-sequence "$CATALOG_SEQUENCE" \
            --expected-target linux-x64 \
            --expected-jamulus-version 3.12.3 \
            --expected-catalog-envelope-sha256 "$CATALOG_ENVELOPE_SHA256" \
            --expected-catalog-payload-sha256 "$CATALOG_PAYLOAD_SHA256" \
            --expected-signer-fingerprint-sha256 "$SIGNER_FINGERPRINT_SHA256"

  frozen-package-smoke-native:
    name: Prove live catalog from frozen ${{ matrix.target }} package
    needs: frozen-package-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
            artifact: webjam-windows-x64
            package: WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip
          - os: macos-14
            target: macos-arm64
            artifact: webjam-macos-arm64
            package: WebJam-macos-arm64-ADHOC-TEST-ONLY.zip
          - os: macos-15-intel
            target: macos-x64
            artifact: webjam-macos-x64
            package: WebJam-macos-x64-ADHOC-TEST-ONLY.zip
    steps:
      - name: Checkout exact frozen release source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs['frozen-package-smoke'].outputs.tag_commit }}
          persist-credentials: false

      - name: Set up isolated smoke runner
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Select exact bound native artifact identity
        id: artifact
        shell: bash
        env:
          EXPECTED_ARTIFACT_BINDINGS: ${{ needs['frozen-package-smoke'].outputs.release_artifact_bindings }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          bindings = json.loads(os.environ["EXPECTED_ARTIFACT_BINDINGS"])
          name = os.environ["ARTIFACT_NAME"]
          matches = [item for item in bindings if item.get("name") == name]
          if len(matches) != 1:
              raise SystemExit("Native artifact has no unique frozen binding.")
          binding = matches[0]
          artifact_id = binding.get("id")
          digest = binding.get("digest")
          size = binding.get("size_in_bytes")
          if (
              not isinstance(artifact_id, int)
              or artifact_id <= 0
              or not isinstance(size, int)
              or size <= 0
              or not isinstance(digest, str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
          ):
              raise SystemExit("Native artifact binding is malformed.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_id={artifact_id}\n")
          PY

      - name: Download exact native tag-build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/frozen-target-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs['frozen-package-smoke'].outputs.tag_ci_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error

      - name: Rebind selected package to the read-only proof
        shell: bash
        env:
          EXPECTED_TAG_COMMIT: ${{ needs['frozen-package-smoke'].outputs.tag_commit }}
          EXPECTED_PACKAGE_BINDINGS: ${{ needs['frozen-package-smoke'].outputs.package_bindings }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/frozen-target-artifact
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]]
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          bindings = json.loads(os.environ["EXPECTED_PACKAGE_BINDINGS"])
          package_name = os.environ["PACKAGE_NAME"]
          matches = [item for item in bindings if item.get("name") == package_name]
          if len(matches) != 1:
              raise SystemExit("Native package has no unique frozen binding.")
          package = Path(os.environ["ARTIFACT_DIRECTORY"]) / package_name
          if package.is_symlink() or not package.is_file():
              raise SystemExit("Native frozen package is missing or not a file.")
          details = package.stat()
          expected = matches[0]
          if details.st_size != expected.get("size"):
              raise SystemExit("Native frozen package size changed.")
          with package.open("rb") as package_file:
              digest = hashlib.file_digest(package_file, "sha256").hexdigest()
          if digest != expected.get("sha256"):
              raise SystemExit("Native frozen package checksum changed.")
          PY

      - name: Launch exact Windows package against live signed catalog
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          CATALOG_SEQUENCE: ${{ needs['frozen-package-smoke'].outputs.catalog_sequence }}
          CATALOG_ENVELOPE_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_envelope_sha256 }}
          CATALOG_PAYLOAD_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_payload_sha256 }}
          SIGNER_FINGERPRINT_SHA256: ${{ needs['frozen-package-smoke'].outputs.signer_fingerprint_sha256 }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "frozen-target-artifact/$env:PACKAGE_NAME"
          $destination = Join-Path $env:RUNNER_TEMP "frozen-target-app"
          New-Item -ItemType Directory -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Join-Path $destination "WebJam/WebJam.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Frozen Windows app binary is missing."
          }
          python tests/support/run_frozen_component_catalog_smoke.py `
            --binary $binary `
            --cwd (Join-Path $destination "WebJam") `
            --expected-version $env:VERSION `
            --expected-sequence $env:CATALOG_SEQUENCE `
            --expected-target windows-x64 `
            --expected-jamulus-version 3.12.3 `
            --expected-catalog-envelope-sha256 $env:CATALOG_ENVELOPE_SHA256 `
            --expected-catalog-payload-sha256 $env:CATALOG_PAYLOAD_SHA256 `
            --expected-signer-fingerprint-sha256 $env:SIGNER_FINGERPRINT_SHA256

      - name: Launch exact macOS package against live signed catalog
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          CATALOG_SEQUENCE: ${{ needs['frozen-package-smoke'].outputs.catalog_sequence }}
          CATALOG_ENVELOPE_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_envelope_sha256 }}
          CATALOG_PAYLOAD_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_payload_sha256 }}
          SIGNER_FINGERPRINT_SHA256: ${{ needs['frozen-package-smoke'].outputs.signer_fingerprint_sha256 }}
          PACKAGE_NAME: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frozen-target-artifact/$PACKAGE_NAME"
          destination="$RUNNER_TEMP/frozen-target-app"
          mkdir "$destination"
          ditto -x -k "$archive" "$destination"
          app="$destination/WebJam.app"
          binary="$app/Contents/MacOS/WebJam"
          codesign --verify --deep --strict "$app"
          [[ -x "$binary" && ! -L "$binary" ]]
          python tests/support/run_frozen_component_catalog_smoke.py \
            --binary "$binary" \
            --cwd "$app/Contents/MacOS" \
            --expected-version "$VERSION" \
            --expected-sequence "$CATALOG_SEQUENCE" \
            --expected-target "$TARGET" \
            --expected-jamulus-version 3.12.3 \
            --expected-catalog-envelope-sha256 "$CATALOG_ENVELOPE_SHA256" \
            --expected-catalog-payload-sha256 "$CATALOG_PAYLOAD_SHA256" \
            --expected-signer-fingerprint-sha256 "$SIGNER_FINGERPRINT_SHA256"

  publish-latest:
    name: Revalidate proof and publish as Latest
    needs: [frozen-package-smoke, frozen-package-smoke-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: release-latest
    steps:
      - name: Checkout release-control source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact source identities from the read-only proof
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TAG: ${{ needs['frozen-package-smoke'].outputs.tag }}
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          EXPECTED_TAG_OBJECT: ${{ needs['frozen-package-smoke'].outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs['frozen-package-smoke'].outputs.tag_commit }}
          EXPECTED_MASTER_COMMIT: ${{ needs['frozen-package-smoke'].outputs.master_commit }}
          EXPECTED_WORKFLOW_COMMIT: ${{ needs['frozen-package-smoke'].outputs.workflow_commit }}
          EXPECTED_COMPONENT_TAG_OBJECT: ${{ needs['frozen-package-smoke'].outputs.component_tag_object }}
          EXPECTED_COMPONENT_TAG_COMMIT: ${{ needs['frozen-package-smoke'].outputs.component_tag_commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" == "$TAG" ]]
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$TAG" == "v${VERSION}" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_WORKFLOW_COMMIT" ]]
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master"
          historical_ref="refs/webjam-historical-tags/v0.22.0"
          git fetch --no-tags origin \
            "refs/tags/v0.22.0:${historical_ref}"
          tag_ref="refs/webjam-release-tags/${TAG}"
          git fetch --no-tags origin "refs/tags/${TAG}:${tag_ref}"
          component_ref="refs/webjam-component-tags/$COMPONENT_CHANNEL_TAG"
          git fetch --no-tags origin \
            "refs/tags/$COMPONENT_CHANNEL_TAG:${component_ref}"
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          [[ "$(git rev-parse "$tag_ref")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${tag_ref}^{commit}")" == \
            "$EXPECTED_TAG_COMMIT" ]]
          [[ "$(git rev-parse refs/remotes/origin/master)" == \
            "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_TAG_COMMIT" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_WORKFLOW_COMMIT" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$(git ls-remote --refs origin "refs/tags/$TAG" \
            | awk 'NR == 1 {print $1}')" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git ls-remote --refs origin refs/heads/master \
            | awk 'NR == 1 {print $1}')" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$(git cat-file -t "$historical_ref")" == "tag" ]]
          [[ "$(git rev-parse "$historical_ref")" == "$V0220_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${historical_ref}^{commit}")" == \
            "$V0220_TAG_COMMIT" ]]
          [[ "$(git ls-remote --refs origin refs/tags/v0.22.0 \
            | awk 'NR == 1 {print $1}')" == "$V0220_TAG_OBJECT" ]]
          [[ "$(git cat-file -t "$component_ref")" == "commit" ]]
          [[ "$(git rev-parse "$component_ref")" == \
            "$EXPECTED_COMPONENT_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${component_ref}^{commit}")" == \
            "$EXPECTED_COMPONENT_TAG_COMMIT" ]]
          [[ "$EXPECTED_COMPONENT_TAG_OBJECT" == "$COMPONENT_CHANNEL_ANCHOR" ]]
          [[ "$EXPECTED_COMPONENT_TAG_COMMIT" == "$COMPONENT_CHANNEL_ANCHOR" ]]
          [[ "$(git ls-remote --refs origin \
            "refs/tags/$COMPONENT_CHANNEL_TAG" | awk 'NR == 1 {print $1}')" == \
            "$EXPECTED_COMPONENT_TAG_OBJECT" ]]
          git merge-base --is-ancestor \
            "$EXPECTED_COMPONENT_TAG_COMMIT" "$EXPECTED_TAG_COMMIT"
          git checkout --detach "$EXPECTED_TAG_COMMIT"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]]
          version_source="$(git show \
            "${EXPECTED_TAG_COMMIT}:webjam_qt/__init__.py")"
          packaged_version="$(sed -n \
            's/^__version__ = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' \
            <<<"$version_source")"
          [[ "$packaged_version" == "$VERSION" ]]

      - name: Set up Python for signed component-catalog verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install hash-locked component-catalog verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement \
            requirements-lock/component-catalog-verifier-linux-x64.txt
          python -m pip check

      - name: Download and verify exact draft inventory and checksums
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs['frozen-package-smoke'].outputs.tag }}
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          EXPECTED_PACKAGE_BINDINGS: ${{ needs['frozen-package-smoke'].outputs.package_bindings }}
          EXPECTED_PACKAGE_BINDINGS_SHA256: ${{ needs['frozen-package-smoke'].outputs.package_bindings_sha256 }}
          EXPECTED_LINUX_PACKAGE_SHA256: ${{ needs['frozen-package-smoke'].outputs.linux_package_sha256 }}
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages-before.json"
          jq -e \
            --arg tag "$TAG" \
            --arg expected_name \
              "WebJam v${VERSION} — unsigned private test candidate." \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("expected exactly one release for " + $tag)
                elif (
                  $matches[0].draft != true
                  or $matches[0].prerelease != false
                  or $matches[0].name != $expected_name
                  or ($matches[0].body | type) != "string"
                ) then
                  error("release draft state, name, or body type is invalid")
                elif (
                  ($matches[0].body | contains(
                    "This is an unsigned private test candidate, not a production-trusted release."
                  ) | not)
                  or ($matches[0].body | contains(
                    "Windows packages are unsigned."
                  ) | not)
                  or ($matches[0].body | contains(
                    "macOS packages are ad-hoc signed"
                  ) | not)
                  or ($matches[0].body | contains(
                    "notarized or reviewed by Apple"
                  ) | not)
                  or ($matches[0].body | contains(
                    "gates remain **NOT RUN**"
                  ) | not)
                  or ($matches[0].body | contains(
                    "cryptography to 50.0.0"
                  ) | not)
                  or ($matches[0].body | contains(
                    "CVE-2026-69247, CVE-2026-69248, and CVE-2026-69249"
                  ) | not)
                  or ($matches[0].body | contains(
                    "Jamulus 3.12.3 updates are authorized"
                  ) | not)
                ) then
                  error("release draft is missing required trust or security notes")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/release-pages-before.json" \
            > "$RUNNER_TEMP/release-before.json"
          expected=(
            "WebJam-linux-x64.zip"
            "WebJam-macos-arm64-ADHOC-TEST-ONLY.zip"
            "WebJam-macos-x64-ADHOC-TEST-ONLY.zip"
            "WebJam-v${VERSION}-macos-arm64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-macos-x64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-windows-x64-UNSIGNED-TEST-ONLY-setup.exe"
            "WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip"
            "WebJam-v${VERSION}-SHA256SUMS.txt"
          )
          mapfile -t remote < <(jq -r '.assets[].name' \
            "$RUNNER_TEMP/release-before.json" | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${wanted[@]}") \
            <(printf '%s\n' "${remote[@]}")
          jq -e \
            '
              (.assets | length) == 8
              and all(
                .assets[];
                (.size > 0)
                and (.digest | type == "string")
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' \
            "$RUNNER_TEMP/release-before.json" >/dev/null
          linux_asset_id="$(jq -r \
            '[.assets[] | select(.name == "WebJam-linux-x64.zip")] | .[0].id' \
            "$RUNNER_TEMP/release-before.json")"
          linux_asset_digest="$(jq -r \
            '[.assets[] | select(.name == "WebJam-linux-x64.zip")] | .[0].digest' \
            "$RUNNER_TEMP/release-before.json")"
          [[ "$linux_asset_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$linux_asset_digest" == \
            "sha256:$EXPECTED_LINUX_PACKAGE_SHA256" ]]
          release_id="$(jq -r '.id' "$RUNNER_TEMP/release-before.json")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          mkdir release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          cd release-assets
          mapfile -t actual < <(find . -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${wanted[@]}") \
            <(printf '%s\n' "${actual[@]}")
          for asset in "${expected[@]}"; do
            [[ -s "$asset" && ! -L "$asset" ]]
            local_sha="$(sha256sum -- "$asset" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name)] | .[0].digest' \
              "$RUNNER_TEMP/release-before.json")"
            [[ "sha256:$local_sha" == "$remote_digest" ]]
          done
          linux_package_sha256="$(sha256sum -- \
            "WebJam-linux-x64.zip" | awk '{print $1}')"
          [[ "$linux_package_sha256" == "$EXPECTED_LINUX_PACKAGE_SHA256" ]]
          bindings_sha256="$(printf '%s' "$EXPECTED_PACKAGE_BINDINGS" \
            | sha256sum | awk '{print $1}')"
          [[ "$bindings_sha256" == "$EXPECTED_PACKAGE_BINDINGS_SHA256" ]]
          jq -e '
            (type == "array")
            and length == 7
            and ([.[].name] | unique | length) == 7
            and all(
              .[];
              (.name | type == "string")
              and (.sha256 | type == "string")
              and (.sha256 | test("^[0-9a-f]{64}$"))
              and (.size | type == "number")
              and .size > 0
            )
          ' <<<"$EXPECTED_PACKAGE_BINDINGS" >/dev/null
          : > "$RUNNER_TEMP/draft-package-binding-lines.jsonl"
          for package in "${expected[@]:0:7}"; do
            package_sha256="$(sha256sum -- "$package" | awk '{print $1}')"
            package_size="$(stat -c '%s' "$package")"
            jq -cn \
              --arg name "$package" \
              --arg sha256 "$package_sha256" \
              --argjson size "$package_size" \
              '{name: $name, sha256: $sha256, size: $size}' \
              >> "$RUNNER_TEMP/draft-package-binding-lines.jsonl"
          done
          actual_package_bindings="$(jq -sc 'sort_by(.name)' \
            "$RUNNER_TEMP/draft-package-binding-lines.jsonl")"
          [[ "$actual_package_bindings" == "$EXPECTED_PACKAGE_BINDINGS" ]]
          checksum_file="WebJam-v${VERSION}-SHA256SUMS.txt"
          [[ "$(wc -l < "$checksum_file")" -eq 7 ]]
          mapfile -t checksummed < <(
            sed -n 's/^[0-9a-f]\{64\}  //p' "$checksum_file" | LC_ALL=C sort
          )
          mapfile -t packages < <(
            printf '%s\n' "${expected[@]:0:7}" | LC_ALL=C sort
          )
          diff -u \
            <(printf '%s\n' "${packages[@]}") \
            <(printf '%s\n' "${checksummed[@]}")
          sha256sum --check --strict "$checksum_file"
          sha256sum -- "${expected[@]}" \
            > "$RUNNER_TEMP/release-assets-before.sha256"

      - name: Reverify exact live component catalog from the read-only proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          EXPECTED_COMPONENT_RELEASE_ID: ${{ needs['frozen-package-smoke'].outputs.component_release_id }}
          EXPECTED_COMPONENT_ASSET_ID: ${{ needs['frozen-package-smoke'].outputs.component_asset_id }}
          EXPECTED_COMPONENT_ASSET_DIGEST: ${{ needs['frozen-package-smoke'].outputs.component_asset_digest }}
          EXPECTED_CATALOG_SEQUENCE: ${{ needs['frozen-package-smoke'].outputs.catalog_sequence }}
          EXPECTED_CATALOG_ENVELOPE_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_envelope_sha256 }}
          EXPECTED_CATALOG_PAYLOAD_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_payload_sha256 }}
          EXPECTED_SIGNER_FINGERPRINT_SHA256: ${{ needs['frozen-package-smoke'].outputs.signer_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          component_tag="$COMPONENT_CHANNEL_TAG"
          component_asset="WebJam-Jamulus-components-v1.json"
          jq -e \
            --arg tag "$component_tag" \
            --arg asset "$component_asset" \
            --argjson release_id "$EXPECTED_COMPONENT_RELEASE_ID" \
            --argjson asset_id "$EXPECTED_COMPONENT_ASSET_ID" \
            --arg digest "$EXPECTED_COMPONENT_ASSET_DIGEST" \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("component release identity changed")
                elif (
                  $matches[0].id != $release_id
                  or $matches[0].draft != false
                  or $matches[0].prerelease != true
                  or ($matches[0].assets | length) != 1
                  or $matches[0].assets[0].name != $asset
                  or $matches[0].assets[0].id != $asset_id
                  or $matches[0].assets[0].digest != $digest
                  or $matches[0].assets[0].size <= 0
                ) then
                  error("component release differs from the read-only proof")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/release-pages-before.json" \
            > "$RUNNER_TEMP/component-release-before.json"
          mkdir "$RUNNER_TEMP/component-catalog-before"
          catalog="$RUNNER_TEMP/component-catalog-before/$component_asset"
          gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$EXPECTED_COMPONENT_ASSET_ID" \
            > "$catalog"
          [[ -s "$catalog" && ! -L "$catalog" ]]
          catalog_envelope_sha256="$(sha256sum -- "$catalog" | awk '{print $1}')"
          [[ "$catalog_envelope_sha256" == \
            "$EXPECTED_CATALOG_ENVELOPE_SHA256" ]]
          [[ "sha256:$catalog_envelope_sha256" == \
            "$EXPECTED_COMPONENT_ASSET_DIGEST" ]]
          python -m tools.verify_jamulus_component_catalog \
            --webjam-version "$VERSION" \
            --minimum-sequence "$MINIMUM_COMPONENT_CATALOG_SEQUENCE" \
            "$catalog" \
            > "$RUNNER_TEMP/component-catalog-verification-before.json"
          jq -e \
            --arg version "$VERSION" \
            --argjson sequence "$EXPECTED_CATALOG_SEQUENCE" \
            --arg payload "$EXPECTED_CATALOG_PAYLOAD_SHA256" \
            --arg signer "$EXPECTED_SIGNER_FINGERPRINT_SHA256" \
            '
              .sequence == $sequence
              and .webjam_version == $version
              and .component_count == 8
              and .payload_sha256 == $payload
              and .signer_fingerprint_sha256 == $signer
            ' \
            "$RUNNER_TEMP/component-catalog-verification-before.json" \
            >/dev/null

      - name: Revalidate all bound identities and publish exact draft as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs['frozen-package-smoke'].outputs.tag }}
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          EXPECTED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          EXPECTED_TAG_OBJECT: ${{ needs['frozen-package-smoke'].outputs.tag_object }}
          EXPECTED_TAG_COMMIT: ${{ needs['frozen-package-smoke'].outputs.tag_commit }}
          EXPECTED_MASTER_COMMIT: ${{ needs['frozen-package-smoke'].outputs.master_commit }}
          EXPECTED_COMPONENT_TAG_OBJECT: ${{ needs['frozen-package-smoke'].outputs.component_tag_object }}
          EXPECTED_COMPONENT_TAG_COMMIT: ${{ needs['frozen-package-smoke'].outputs.component_tag_commit }}
          EXPECTED_COMPONENT_RELEASE_ID: ${{ needs['frozen-package-smoke'].outputs.component_release_id }}
          EXPECTED_COMPONENT_ASSET_ID: ${{ needs['frozen-package-smoke'].outputs.component_asset_id }}
          EXPECTED_COMPONENT_ASSET_DIGEST: ${{ needs['frozen-package-smoke'].outputs.component_asset_digest }}
          EXPECTED_CATALOG_SEQUENCE: ${{ needs['frozen-package-smoke'].outputs.catalog_sequence }}
          EXPECTED_CATALOG_ENVELOPE_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_envelope_sha256 }}
          EXPECTED_CATALOG_PAYLOAD_SHA256: ${{ needs['frozen-package-smoke'].outputs.catalog_payload_sha256 }}
          EXPECTED_SIGNER_FINGERPRINT_SHA256: ${{ needs['frozen-package-smoke'].outputs.signer_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          remote_tag_object="$(git ls-remote --refs origin \
            "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"
          remote_master_commit="$(git ls-remote --refs origin \
            refs/heads/master | awk 'NR == 1 {print $1}')"
          remote_component_tag_object="$(git ls-remote --refs origin \
            "refs/tags/$COMPONENT_CHANNEL_TAG" | awk 'NR == 1 {print $1}')"
          [[ "$remote_tag_object" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$remote_master_commit" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$remote_component_tag_object" == \
            "$EXPECTED_COMPONENT_TAG_OBJECT" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TAG_COMMIT" ]]
          [[ "$EXPECTED_TAG_COMMIT" == "$EXPECTED_MASTER_COMMIT" ]]
          [[ "$EXPECTED_COMPONENT_TAG_OBJECT" == "$COMPONENT_CHANNEL_ANCHOR" ]]
          [[ "$EXPECTED_COMPONENT_TAG_COMMIT" == "$COMPONENT_CHANNEL_ANCHOR" ]]
          git merge-base --is-ancestor \
            "$EXPECTED_COMPONENT_TAG_COMMIT" "$EXPECTED_TAG_COMMIT"
          historical_ref="refs/webjam-historical-tags/v0.22.0"
          [[ "$(git cat-file -t "$historical_ref")" == "tag" ]]
          [[ "$(git rev-parse "$historical_ref")" == "$V0220_TAG_OBJECT" ]]
          [[ "$(git rev-parse "${historical_ref}^{commit}")" == \
            "$V0220_TAG_COMMIT" ]]
          [[ "$(git ls-remote --refs origin refs/tags/v0.22.0 \
            | awk 'NR == 1 {print $1}')" == "$V0220_TAG_OBJECT" ]]

          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages-immediately-before.json"
          jq -e \
            --arg tag "$TAG" \
            --argjson release_id "$EXPECTED_RELEASE_ID" \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("desktop draft identity changed")
                elif (
                  $matches[0].id != $release_id
                  or $matches[0].draft != true
                  or $matches[0].prerelease != false
                ) then
                  error("desktop draft is no longer the verified release")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/release-pages-immediately-before.json" \
            > "$RUNNER_TEMP/release-immediately-before.json"
          diff -u \
            <(jq -S \
              '{id,tag_name,name,body,draft,prerelease,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-before.json") \
            <(jq -S \
              '{id,tag_name,name,body,draft,prerelease,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-immediately-before.json")

          component_tag="$COMPONENT_CHANNEL_TAG"
          component_asset="WebJam-Jamulus-components-v1.json"
          jq -e \
            --arg tag "$component_tag" \
            --argjson release_id "$EXPECTED_COMPONENT_RELEASE_ID" \
            --argjson asset_id "$EXPECTED_COMPONENT_ASSET_ID" \
            --arg digest "$EXPECTED_COMPONENT_ASSET_DIGEST" \
            '
              [ .[][] | select(.tag_name == $tag) ] as $matches
              | if ($matches | length) != 1 then
                  error("component release identity changed")
                elif (
                  $matches[0].id != $release_id
                  or $matches[0].draft != false
                  or $matches[0].prerelease != true
                  or ($matches[0].assets | length) != 1
                  or $matches[0].assets[0].id != $asset_id
                  or $matches[0].assets[0].digest != $digest
                ) then
                  error("component release is no longer the verified prerelease")
                else
                  $matches[0]
                end
            ' \
            "$RUNNER_TEMP/release-pages-immediately-before.json" \
            > "$RUNNER_TEMP/component-release-immediately-before.json"
          diff -u \
            <(jq -S \
              '{id,tag_name,draft,prerelease,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/component-release-before.json") \
            <(jq -S \
              '{id,tag_name,draft,prerelease,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/component-release-immediately-before.json")
          rm -rf "$RUNNER_TEMP/component-catalog-immediately-before"
          mkdir "$RUNNER_TEMP/component-catalog-immediately-before"
          catalog="$RUNNER_TEMP/component-catalog-immediately-before/$component_asset"
          gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$EXPECTED_COMPONENT_ASSET_ID" \
            > "$catalog"
          [[ -s "$catalog" && ! -L "$catalog" ]]
          catalog_envelope_sha256="$(sha256sum -- "$catalog" | awk '{print $1}')"
          [[ "$catalog_envelope_sha256" == \
            "$EXPECTED_CATALOG_ENVELOPE_SHA256" ]]
          [[ "sha256:$catalog_envelope_sha256" == \
            "$EXPECTED_COMPONENT_ASSET_DIGEST" ]]
          python -m tools.verify_jamulus_component_catalog \
            --webjam-version "$VERSION" \
            --minimum-sequence "$MINIMUM_COMPONENT_CATALOG_SEQUENCE" \
            "$catalog" \
            > "$RUNNER_TEMP/component-catalog-verification-immediately-before.json"
          jq -e \
            --arg version "$VERSION" \
            --argjson sequence "$EXPECTED_CATALOG_SEQUENCE" \
            --arg payload "$EXPECTED_CATALOG_PAYLOAD_SHA256" \
            --arg signer "$EXPECTED_SIGNER_FINGERPRINT_SHA256" \
            '
              .sequence == $sequence
              and .webjam_version == $version
              and .component_count == 8
              and .payload_sha256 == $payload
              and .signer_fingerprint_sha256 == $signer
            ' \
            "$RUNNER_TEMP/component-catalog-verification-immediately-before.json" \
            >/dev/null

          release_id="$(jq -r '.id' "$RUNNER_TEMP/release-before.json")"
          [[ "$release_id" == "$EXPECTED_RELEASE_ID" ]]
          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > "$RUNNER_TEMP/release-publish-response.json"
          jq -e \
            --arg tag "$TAG" \
            --argjson release_id "$EXPECTED_RELEASE_ID" \
            --arg expected_name \
              "WebJam v${VERSION} — unsigned private test candidate." \
            '
              .id == $release_id
              and .tag_name == $tag
              and .name == $expected_name
              and .draft == false
              and .prerelease == false
              and .immutable == true
            ' \
            "$RUNNER_TEMP/release-publish-response.json" >/dev/null
          diff -u \
            <(jq -S \
              '{id,tag_name,name,body,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-before.json") \
            <(jq -S \
              '{id,tag_name,name,body,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-publish-response.json")

      - name: Redownload and verify published Latest bytes and identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs['frozen-package-smoke'].outputs.tag }}
          VERSION: ${{ needs['frozen-package-smoke'].outputs.version }}
          EXPECTED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/release-latest.json"
          jq -e \
            --arg tag "$TAG" \
            --argjson release_id "$EXPECTED_RELEASE_ID" \
            --arg expected_name \
              "WebJam v${VERSION} — unsigned private test candidate." \
            '
              .id == $release_id
              and .tag_name == $tag
              and .name == $expected_name
              and .draft == false
              and .prerelease == false
              and .immutable == true
            ' \
            "$RUNNER_TEMP/release-latest.json" >/dev/null
          diff -u \
            <(jq -S \
              '{id,tag_name,name,body,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-before.json") \
            <(jq -S \
              '{id,tag_name,name,body,assets:([.assets[]|{id,name,size,digest}]|sort_by(.name))}' \
              "$RUNNER_TEMP/release-latest.json")

          mkdir published-release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-release-assets
          cd published-release-assets
          expected=(
            "WebJam-linux-x64.zip"
            "WebJam-macos-arm64-ADHOC-TEST-ONLY.zip"
            "WebJam-macos-x64-ADHOC-TEST-ONLY.zip"
            "WebJam-v${VERSION}-macos-arm64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-macos-x64-ADHOC-TEST-ONLY.dmg"
            "WebJam-v${VERSION}-windows-x64-UNSIGNED-TEST-ONLY-setup.exe"
            "WebJam-windows-x64-UNSIGNED-TEST-ONLY.zip"
            "WebJam-v${VERSION}-SHA256SUMS.txt"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${wanted[@]}") \
            <(printf '%s\n' "${actual[@]}")
          for asset in "${expected[@]}"; do
            [[ -s "$asset" && ! -L "$asset" ]]
            local_sha="$(sha256sum -- "$asset" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name)] | .[0].digest' \
              "$RUNNER_TEMP/release-latest.json")"
            [[ "sha256:$local_sha" == "$remote_digest" ]]
          done
          sha256sum --check --strict \
            "$RUNNER_TEMP/release-assets-before.sha256"
          checksum_file="WebJam-v${VERSION}-SHA256SUMS.txt"
          [[ "$(wc -l < "$checksum_file")" -eq 7 ]]
          mapfile -t checksummed < <(
            sed -n 's/^[0-9a-f]\{64\}  //p' "$checksum_file" | LC_ALL=C sort
          )
          mapfile -t packages < <(
            printf '%s\n' "${expected[@]:0:7}" | LC_ALL=C sort
          )
          diff -u \
            <(printf '%s\n' "${packages[@]}") \
            <(printf '%s\n' "${checksummed[@]}")
          sha256sum --check --strict "$checksum_file"
