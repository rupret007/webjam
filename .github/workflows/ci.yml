name: WebJam CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UX smoke gate
        run: |
          python ux_smoke_test.py

      - name: Run test suite
        run: |
          python -m unittest test_webjam.py test_modernization.py

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-13
            target: macos-x64
          - os: macos-14
            target: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build desktop artifact
        shell: bash
        run: |
          HIDDEN="--hidden-import=customtkinter --hidden-import=numpy --hidden-import=sounddevice --hidden-import=fastapi --hidden-import=uvicorn"
          mkdir -p out
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            python -m PyInstaller --clean --noconfirm --onefile --windowed --name WebJam $HIDDEN webjam_app_enhanced.py
            cp dist/WebJam.exe "out/WebJam-${{ matrix.target }}.exe"
          else
            python -m PyInstaller --clean --noconfirm --windowed --name WebJam $HIDDEN webjam_app_enhanced.py
            ditto -c -k --sequesterRsrc --keepParent dist/WebJam.app "out/WebJam-${{ matrix.target }}.zip"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webjam-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
