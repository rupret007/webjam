name: WebJam CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Default: read-only. Release job overrides to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. Pushes to branches/tags must run to
  # completion so master always produces a green build + release artifacts
  # (rapid successive pushes previously cancelled every run, leaving the
  # branch with no green CI and no downloadable builds).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ------------------------------------------------------------------
  # Job 1: Tests
  # Runs on ubuntu-latest (faster/cheaper than windows-latest).
  # Uses pytest against the tests/ directory.
  # Sets QT_QPA_PLATFORM=offscreen for headless Qt tests.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt + audio system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libportaudio2 \
            python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check webjam_qt/ core/ ui/mixer_service.py

      - name: Run UX smoke gate
        run: python ux_smoke_test.py

      # test_elevation_edge.py uses @skipUnless(win32) so runs safely on Linux
      # (skips all tests) — no --ignore needed for it.
      - name: Run test suite
        run: |
          pytest tests/ -v

  # ------------------------------------------------------------------
  # Job 2: Build desktop artifacts
  # Two targets built from webjam.spec (single source of truth):
  #   windows-x64  → windows-latest (x86-64)
  #   macos-arm64  → macos-14       (Apple Silicon M1/M2)
  # macos-x64 (Intel) was dropped 2026-07: GitHub retired macos-13, the
  # last Intel hosted runner — the matrix entry sat "awaiting a runner"
  # for 24h and killed every release run. Intel Mac users: run from
  # source (README) until we add a self-hosted/cross build.
  #
  # Windows: dist/WebJam/ directory → zipped with 7z
  # macOS:   dist/WebJam.app bundle → zipped with ditto
  # ------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build desktop artifact
        shell: bash
        run: |
          mkdir -p out
          python -m PyInstaller --clean --noconfirm webjam.spec

          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            # spec uses COLLECT → produces dist/WebJam/ directory; zip it
            cd dist && 7z a "../out/WebJam-${{ matrix.target }}.zip" WebJam/ && cd ..
          else
            # macOS: ditto preserves resource forks and extended attributes
            ditto -c -k --sequesterRsrc --keepParent \
              dist/WebJam.app \
              "out/WebJam-${{ matrix.target }}.zip"
          fi

      - name: Sign Windows executable (optional)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64)) {
            Write-Host "No code-signing cert configured; skipping sign step."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue `
            | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          # Extract zip, sign the exe, re-zip
          Expand-Archive "out\WebJam-windows-x64.zip" `
            -DestinationPath "$env:RUNNER_TEMP\sign_work" -Force
          & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD `
            /tr https://timestamp.digicert.com /td sha256 /fd sha256 `
            "$env:RUNNER_TEMP\sign_work\WebJam\WebJam.exe"
          cd "$env:RUNNER_TEMP\sign_work"
          7z a "$env:GITHUB_WORKSPACE\out\WebJam-windows-x64.zip" WebJam\
          Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webjam-${{ matrix.target }}
          path: out/WebJam-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 3: GitHub Release
  # Only runs on tag pushes matching v*.*.* (e.g. v0.3.0).
  # Downloads both artifacts and attaches them to a GitHub Release.
  # Auto-generates release notes from commits since previous tag.
  # ------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download windows-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: webjam-windows-x64
          path: release-assets/

      - name: Download macos-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: webjam-macos-arm64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
