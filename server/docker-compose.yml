# WebJam legacy-compatible Linux band server — Jamulus 3.9.0 with
# multitrack recording + JSON-RPC control. The v0.8.1 Mac mini pilot uses
# official Jamulus 3.12.2 natively; see server/README.md.
#
# One command on any $5/mo VPS (or a spare machine with port forwarding):
#
#   docker compose up -d
#
# What you get:
#   - A private Jamulus server on UDP 22124 for the band to jam on.
#   - MULTITRACK RECORDING: every musician is captured to their own track,
#     and each take is written as a ready-to-open Reaper project (.rpp)
#     plus per-musician WAVs under ./recordings/.
#   - JSON-RPC control on 127.0.0.1:22222 (NOT exposed publicly — reach it
#     via SSH tunnel; see README.md) so WebJam's Record button can start/
#     stop recordings remotely.
#
# Before first start:  echo "$(openssl rand -base64 24)" > jsonrpc.secret

services:
  jamulus:
    image: grundic/jamulus:3.9.0@sha256:20836f9a0fe063858960907c2f1137a8e8bf80c5a6b87dbf8fc696048c2da2d8
    container_name: webjam-server
    restart: unless-stopped
    network_mode: host          # UDP latency — avoid docker NAT on the audio path
    volumes:
      - ./recordings:/recordings
      - ./jsonrpc.secret:/run/jamulus/jsonrpc.secret:ro
    command: >
      --server
      --nogui
      --port 22124
      --recording /recordings
      --norecord
      --welcomemessage "WebJam band server — press Record in WebJam to tape the session"
      --jsonrpcport 22222
      --jsonrpcsecretfile /run/jamulus/jsonrpc.secret
